<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="DSH Remote Control — 把电脑上正在跑的 AI 编码任务装进手机口袋">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#111C3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <circle cx="1060" cy="120" r="280" fill="url(#glow)"/>
  <circle cx="1180" cy="290" r="210" fill="url(#glow2)"/>

  <!-- Right side: Minimalist Laptop -> Phone connection graphic -->
  <g transform="translate(940, 76)">
    <!-- Laptop card -->
    <rect x="0" y="34" width="136" height="92" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="14" cy="48" r="3.5" fill="#EF4444"/>
    <circle cx="25" cy="48" r="3.5" fill="#F59E0B"/>
    <circle cx="36" cy="48" r="3.5" fill="#10B981"/>
    <rect x="14" y="64" width="76" height="6" rx="3" fill="#38BDF8" fill-opacity="0.8"/>
    <rect x="14" y="78" width="104" height="6" rx="3" fill="#64748B" fill-opacity="0.5"/>
    <rect x="14" y="92" width="60" height="6" rx="3" fill="#10B981" fill-opacity="0.8"/>
    <path d="M-12 126 H148 L138 136 H-2 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Animated/Glowing Bridge Arc -->
    <path d="M144 80 C168 80, 168 80, 190 80" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 4"/>
    <circle cx="167" cy="80" r="5" fill="#10B981"/>

    <!-- Phone card -->
    <rect x="196" y="6" width="96" height="176" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="228" y="14" width="32" height="4" rx="2" fill="#334155"/>
    <!-- Status pill on phone -->
    <rect x="208" y="30" width="72" height="36" rx="7" fill="#1E293B" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="218" cy="42" r="3.5" fill="#10B981"/>
    <rect x="226" y="39" width="44" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="215" y="52" width="52" height="4" rx="2" fill="#64748B"/>
    <!-- Approval card on phone -->
    <rect x="208" y="74" width="72" height="54" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="215" y="83" width="54" height="5" rx="2.5" fill="#FCD34D"/>
    <rect x="215" y="94" width="42" height="4" rx="2" fill="#94A3B8"/>
    <rect x="215" y="107" width="27" height="13" rx="4" fill="#10B981"/>
    <rect x="246" y="107" width="27" height="13" rx="4" fill="#334155"/>
    <!-- Input bar on phone -->
    <rect x="208" y="138" width="72" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="260" y="142" width="16" height="12" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Left accent bar -->
  <rect x="76" y="88" width="5" height="134" rx="2.5" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="104" y="108" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#38BDF8">OPEN SOURCE · 免费自托管 · 代码与对话不离本机</text>

  <!-- Main Title -->
  <text x="102" y="172" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">DSH Remote Control</text>

  <!-- Clear human subtitle (no Feishu jargon) -->
  <text x="104" y="216" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="500" fill="#CBD5E1">把电脑上正在跑的 AI 编码任务装进手机口袋 —— 随时看进度、发指令、紧急叫停、点一下批准操作</text>

  <!-- Recognizable Tool & Capability Pills -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">
    <rect x="104" y="256" width="108" height="36" rx="18" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.4"/>
    <text x="158" y="279" fill="#E0F2FE">🟣 DSH</text>

    <rect x="224" y="256" width="164" height="36" rx="18" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.4"/>
    <text x="306" y="279" fill="#E0F2FE">⚡ Antigravity IDE</text>

    <rect x="400" y="256" width="142" height="36" rx="18" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.4"/>
    <text x="471" y="279" fill="#E0F2FE">✴️ Claude Code</text>

    <rect x="554" y="256" width="112" height="36" rx="18" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.4"/>
    <text x="610" y="279" fill="#E0F2FE">🧠 Codex</text>

    <rect x="678" y="256" width="168" height="36" rx="18" fill="#10B981" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="762" y="279" fill="#D1FAE5">📱 手机扫码免密即用</text>
  </g>
</svg>
