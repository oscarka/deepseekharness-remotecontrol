<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="DSH Remote Control — 用手机与飞书遥控你的 AI 编码助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEFDFA"/>
      <stop offset="0.55" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F6EEDD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C87E"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E9D3A0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C87F" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E8C87F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8C87F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2DCA8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2DCA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C9A227" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#C9A227" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1090" cy="120" r="340" fill="url(#glow)"/>
  <circle cx="1230" cy="330" r="240" fill="url(#glow2)"/>
  <circle cx="110" cy="40" r="260" fill="url(#glow2)"/>

  <!-- decorative rings -->
  <g fill="none" stroke="#C9A227" stroke-opacity="0.22">
    <circle cx="1085" cy="200" r="96" stroke-width="1.5"/>
    <circle cx="1085" cy="200" r="132" stroke-width="1.2" stroke-opacity="0.15"/>
    <circle cx="1085" cy="200" r="170" stroke-width="1" stroke-opacity="0.1"/>
  </g>
  <circle cx="1085" cy="200" r="34" fill="#FFFDF8" stroke="#C9A227" stroke-opacity="0.65" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M1078 190v20M1085 186v28M1092 193v16" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <circle cx="1085" cy="104" r="5" fill="#C9A227"/>
  <circle cx="1181" cy="200" r="4" fill="#D9B45A"/>
  <circle cx="989" cy="200" r="4" fill="#E3C87F"/>

  <g fill="#C9A227" fill-opacity="0.45">
    <circle cx="900" cy="70" r="2"/>
    <circle cx="1240" cy="170" r="2.4"/>
    <circle cx="950" cy="340" r="2"/>
    <circle cx="1180" cy="372" r="1.8"/>
    <circle cx="1015" cy="30" r="1.6"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="132" width="5" height="128" rx="2.5" fill="url(#accent)"/>

  <text x="112" y="150" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4" fill="#8A6A1F">SELF-HOSTED · OPEN SOURCE</text>
  <text x="110" y="216" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1" fill="#241E15">DSH Remote Control</text>
  <text x="112" y="262" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#6E6151">用手机与飞书，遥控你的 AI 编码助手</text>

  <!-- pills -->
  <g font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    <rect x="112" y="300" width="132" height="36" rx="18" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="178" y="324" fill="#8A6A1F">飞书长连接</text>

    <rect x="256" y="300" width="104" height="36" rx="18" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="308" y="324" fill="#8A6A1F">iOS PWA</text>

    <rect x="372" y="300" width="112" height="36" rx="18" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="428" y="324" fill="#8A6A1F">Web Push</text>

    <rect x="496" y="300" width="118" height="36" rx="18" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="555" y="324" fill="#8A6A1F">E2EE 分享</text>

    <rect x="626" y="300" width="96" height="36" rx="18" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="674" y="324" fill="#8A6A1F">自托管</text>
  </g>
</svg>
