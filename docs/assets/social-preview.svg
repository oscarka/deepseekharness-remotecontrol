<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DSH Remote Control — 用手机与飞书遥控你的 AI 编码助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#111C3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1090" cy="180" r="380" fill="url(#glow)"/>
  <circle cx="1230" cy="520" r="300" fill="url(#glow2)"/>

  <g fill="none" stroke="#60A5FA" stroke-opacity="0.16">
    <circle cx="1085" cy="320" r="110" stroke-width="1.5"/>
    <circle cx="1085" cy="320" r="152" stroke-width="1.2" stroke-opacity="0.11"/>
    <circle cx="1085" cy="320" r="196" stroke-width="1" stroke-opacity="0.07"/>
  </g>
  <circle cx="1085" cy="320" r="38" fill="#0B1220" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M1077 308v24M1085 303v34M1093 312v20" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="1085" cy="210" r="5" fill="#22D3EE"/>
  <circle cx="1195" cy="320" r="4" fill="#3B82F6"/>
  <circle cx="975" cy="320" r="4" fill="#818CF8"/>

  <rect x="80" y="232" width="5" height="152" rx="2.5" fill="url(#accent)"/>

  <text x="112" y="252" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#7DD3FC">SELF-HOSTED · OPEN SOURCE</text>
  <text x="110" y="330" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#F8FAFC">DSH Remote Control</text>
  <text x="112" y="382" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" fill="#94A3B8">用手机与飞书，遥控你的 AI 编码助手</text>

  <g font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    <rect x="112" y="416" width="140" height="38" rx="19" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="182" y="441" fill="#BFDBFE">飞书长连接</text>

    <rect x="264" y="416" width="110" height="38" rx="19" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="319" y="441" fill="#BFDBFE">iOS PWA</text>

    <rect x="386" y="416" width="120" height="38" rx="19" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="446" y="441" fill="#BFDBFE">Web Push</text>

    <rect x="518" y="416" width="126" height="38" rx="19" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="581" y="441" fill="#BFDBFE">E2EE 分享</text>

    <rect x="656" y="416" width="102" height="38" rx="19" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="707" y="441" fill="#BFDBFE">自托管</text>
  </g>
</svg>
