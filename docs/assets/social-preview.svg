<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DSH Remote Control — 用手机与飞书遥控你的 AI 编码助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEFDFA"/>
      <stop offset="0.55" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#F6EEDD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C87E"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E9D3A0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C87F" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#E8C87F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8C87F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2DCA8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2DCA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C9A227" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C9A227" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1090" cy="170" r="420" fill="url(#glow)"/>
  <circle cx="1210" cy="540" r="330" fill="url(#glow2)"/>
  <circle cx="120" cy="80" r="300" fill="url(#glow2)"/>

  <g fill="none" stroke="#C9A227" stroke-opacity="0.22">
    <circle cx="1085" cy="320" r="110" stroke-width="1.5"/>
    <circle cx="1085" cy="320" r="152" stroke-width="1.2" stroke-opacity="0.15"/>
    <circle cx="1085" cy="320" r="196" stroke-width="1" stroke-opacity="0.1"/>
  </g>
  <circle cx="1085" cy="320" r="38" fill="#FFFDF8" stroke="#C9A227" stroke-opacity="0.65" stroke-width="1.5" filter="url(#soft)"/>
  <path d="M1077 308v24M1085 303v34M1093 312v20" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <circle cx="1085" cy="210" r="5" fill="#C9A227"/>
  <circle cx="1195" cy="320" r="4" fill="#D9B45A"/>
  <circle cx="975" cy="320" r="4" fill="#E3C87F"/>

  <g fill="#C9A227" fill-opacity="0.45">
    <circle cx="905" cy="120" r="2"/>
    <circle cx="1240" cy="270" r="2.4"/>
    <circle cx="960" cy="560" r="2"/>
    <circle cx="1180" cy="600" r="1.8"/>
    <circle cx="1010" cy="70" r="1.6"/>
  </g>

  <rect x="80" y="232" width="5" height="152" rx="2.5" fill="url(#accent)"/>

  <text x="112" y="252" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#8A6A1F">SELF-HOSTED · OPEN SOURCE</text>
  <text x="110" y="330" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#241E15">DSH Remote Control</text>
  <text x="112" y="382" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" fill="#6E6151">用手机与飞书，遥控你的 AI 编码助手</text>

  <g font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    <rect x="112" y="416" width="140" height="38" rx="19" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="182" y="441" fill="#8A6A1F">飞书长连接</text>

    <rect x="264" y="416" width="110" height="38" rx="19" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="319" y="441" fill="#8A6A1F">iOS PWA</text>

    <rect x="386" y="416" width="120" height="38" rx="19" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="446" y="441" fill="#8A6A1F">Web Push</text>

    <rect x="518" y="416" width="126" height="38" rx="19" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="581" y="441" fill="#8A6A1F">E2EE 分享</text>

    <rect x="656" y="416" width="102" height="38" rx="19" fill="#FFF9EC" stroke="#E3C98F"/>
    <text x="707" y="441" fill="#8A6A1F">自托管</text>
  </g>
</svg>
