<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="DSH Remote Control — Put your running AI coding agents in your pocket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#111C3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <circle cx="1060" cy="120" r="280" fill="url(#glow)"/>
  <circle cx="1180" cy="290" r="210" fill="url(#glow2)"/>

  <!-- Right side: Minimalist Laptop -> Phone connection graphic -->
  <g transform="translate(950, 76)">
    <!-- Laptop card -->
    <rect x="0" y="34" width="132" height="92" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="14" cy="48" r="3.5" fill="#EF4444"/>
    <circle cx="25" cy="48" r="3.5" fill="#F59E0B"/>
    <circle cx="36" cy="48" r="3.5" fill="#10B981"/>
    <rect x="14" y="64" width="76" height="6" rx="3" fill="#38BDF8" fill-opacity="0.8"/>
    <rect x="14" y="78" width="100" height="6" rx="3" fill="#64748B" fill-opacity="0.5"/>
    <rect x="14" y="92" width="60" height="6" rx="3" fill="#10B981" fill-opacity="0.8"/>
    <path d="M-12 126 H144 L134 136 H-2 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Glowing Bridge Arc -->
    <path d="M140 80 C164 80, 164 80, 186 80" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 4"/>
    <circle cx="163" cy="80" r="5" fill="#10B981"/>

    <!-- Phone card -->
    <rect x="192" y="6" width="96" height="176" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="224" y="14" width="32" height="4" rx="2" fill="#334155"/>
    <!-- Status pill on phone -->
    <rect x="204" y="30" width="72" height="36" rx="7" fill="#1E293B" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="214" cy="42" r="3.5" fill="#10B981"/>
    <rect x="222" y="39" width="44" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="211" y="52" width="52" height="4" rx="2" fill="#64748B"/>
    <!-- Approval card on phone -->
    <rect x="204" y="74" width="72" height="54" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="211" y="83" width="54" height="5" rx="2.5" fill="#FCD34D"/>
    <rect x="211" y="94" width="42" height="4" rx="2" fill="#94A3B8"/>
    <rect x="211" y="107" width="27" height="13" rx="4" fill="#10B981"/>
    <rect x="242" y="107" width="27" height="13" rx="4" fill="#334155"/>
    <!-- Input bar on phone -->
    <rect x="204" y="138" width="72" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="256" y="142" width="16" height="12" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Left accent bar -->
  <rect x="64" y="74" width="5" height="156" rx="2.5" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="90" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2" fill="#38BDF8">OPEN SOURCE · SELF-HOSTED · CODE NEVER LEAVES YOUR MACHINE</text>

  <!-- Main Title -->
  <text x="88" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">DSH Remote Control</text>

  <!-- Clear human subtitle -->
  <text x="90" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="500" fill="#CBD5E1">Put your running AI coding agents in your pocket — watch live progress, approve actions, or steer from your phone</text>

  <!-- 5 Highlight Pills (2 rows for clean spacing) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <!-- Row 1 -->
    <rect x="90" y="226" width="204" height="34" rx="17" fill="#10B981" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="192" y="248" fill="#D1FAE5">📱 1-Scan QR Phone Login</text>

    <rect x="306" y="226" width="234" height="34" rx="17" fill="#F59E0B" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.45"/>
    <text x="423" y="248" fill="#FEF3C7">🛡️ 1-Tap Tool &amp; Plan Approvals</text>

    <rect x="552" y="226" width="256" height="34" rx="17" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="680" y="248" fill="#E0F2FE">🟢 Lock-Screen Alerts &amp; Unread Dots</text>

    <!-- Row 2 -->
    <rect x="90" y="270" width="276" height="34" rx="17" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="228" y="292" fill="#E0F2FE">💻 Multi-Host Hub + Battery &amp; Network</text>

    <rect x="378" y="270" width="318" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="537" y="292" fill="#EDE9FE">🔌 DSH · Antigravity IDE · Claude · Codex</text>
  </g>
</svg>
