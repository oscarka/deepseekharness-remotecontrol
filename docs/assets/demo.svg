<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="880" height="340" rx="20" fill="url(#bg)"/>

  <!-- Left: Computer Terminal (Step 3-5) -->
  <rect x="28" y="28" width="400" height="284" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="5" fill="#ef4444"/>
  <circle cx="64" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="80" cy="48" r="5" fill="#10b981"/>
  <text x="102" y="52" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">Mac 终端 · 一条命令接入控制台</text>

  <text x="46" y="88" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">$ curl -fsSL https://rc.example.com/install.sh \</text>
  <text x="46" y="108" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">    | bash -s -- --code A7K9-M2P4</text>

  <text x="46" y="142" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="600">✅ 配对成功！已获取本机独立凭证 (hst_8f3a2c...)</text>
  <text x="46" y="166" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">• 电脑名称: MacBook-Pro (可随时单独吊销)</text>
  <text x="46" y="188" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">• 检测工具: DSH, Antigravity IDE, Codex, Claude</text>
  <text x="46" y="210" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">• 能力状态: 完整远控模式（看会话/发指令/停止/审批/插话）</text>

  <rect x="46" y="232" width="364" height="62" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="62" y="256" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="700">📱 手机打开同一网址，扫电脑二维码即刻免密登录</text>
  <text x="62" y="276" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5">加第二台电脑：有效期内复用同一配对码 A7K9-M2P4</text>

  <!-- Arrow -->
  <path d="M440 170 L468 170" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="466,164 476,170 466,176" fill="#10b981"/>

  <!-- Right: Mobile Phone View (Step 6-7) -->
  <rect x="488" y="20" width="364" height="300" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="488" y="20" width="364" height="52" rx="22" fill="#ffffff"/>
  <text x="512" y="51" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14.5" font-weight="800">📱 DSH 手机控制台 · 2 台电脑在线</text>

  <!-- Running Card 1 -->
  <rect x="506" y="82" width="328" height="68" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="520" y="104" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700">重构订单決済模块并跑全量单测</text>
  <rect x="756" y="89" width="66" height="20" rx="10" fill="#dcfce7"/>
  <text x="766" y="103" fill="#15803d" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">● 运行中</text>
  <text x="520" y="126" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5">🟣 DSH · 📁 payment-core · ⚡ 支持实时插话 / 停止</text>

  <!-- Approval Card 2 -->
  <rect x="506" y="160" width="328" height="86" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="520" y="182" fill="#92400e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="800">⏳ 待你审批危险操作：bash (rm -rf dist/)</text>
  <text x="520" y="202" fill="#78350f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">rm -rf dist/ &amp;&amp; npm run build</text>
  <rect x="520" y="212" width="96" height="24" rx="7" fill="#10b981"/>
  <text x="543" y="228" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="700">✓ 批准执行</text>
  <rect x="626" y="212" width="76" height="24" rx="7" fill="#fee2e2"/>
  <text x="647" y="228" fill="#dc2626" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="700">✕ 拒绝</text>

  <!-- Composer Bar -->
  <rect x="506" y="258" width="328" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="522" y="284" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">⚡ 实时插话：别改测试快照，只修实现...</text>
  <rect x="766" y="266" width="58" height="28" rx="8" fill="#2563eb"/>
  <text x="782" y="284" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">发送</text>
</svg>
