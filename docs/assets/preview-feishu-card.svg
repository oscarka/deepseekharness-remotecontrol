<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="420" fill="#f8fafc"/>

  <rect x="40" y="28" width="640" height="364" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- header -->
  <rect x="40" y="28" width="640" height="6" rx="3" fill="#2563eb"/>
  <circle cx="76" cy="72" r="14" fill="#eff6ff"/>
  <text x="76" y="77" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">DSH</text>
  <text x="100" y="70" font-size="15" font-weight="600" fill="#0f172a">DSH 远控</text>
  <text x="100" y="88" font-size="11" fill="#94a3b8">任务需要你的批准</text>
  <rect x="576" y="56" width="80" height="26" rx="13" fill="#fffbeb" stroke="#fde68a"/>
  <text x="616" y="73" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">待审批</text>

  <line x1="64" y1="112" x2="656" y2="112" stroke="#f1f5f9"/>

  <!-- task -->
  <text x="64" y="142" font-size="13" fill="#64748b">任务</text>
  <text x="104" y="142" font-size="13" font-weight="500" fill="#0f172a">修复支付回调的幂等性</text>

  <!-- command -->
  <text x="64" y="174" font-size="13" fill="#64748b">命令</text>
  <rect x="64" y="184" width="592" height="86" rx="10" fill="#0f172a"/>
  <text x="80" y="210" font-size="12" fill="#e2e8f0" font-family="'SF Mono', Menlo, monospace">pnpm prisma migrate deploy</text>
  <text x="80" y="230" font-size="12" fill="#94a3b8" font-family="'SF Mono', Menlo, monospace">  --schema prisma/schema.prisma</text>
  <text x="80" y="250" font-size="12" fill="#64748b" font-family="'SF Mono', Menlo, monospace">workdir: services/payments</text>

  <!-- impact -->
  <text x="64" y="296" font-size="12" fill="#64748b">影响</text>
  <text x="100" y="296" font-size="12" fill="#0f172a">1 张表 · 2 个索引 · 无法自动回滚</text>

  <!-- buttons -->
  <rect x="64" y="320" width="120" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="124" y="347" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">拒绝</text>

  <rect x="196" y="320" width="460" height="44" rx="10" fill="#2563eb"/>
  <text x="426" y="347" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">批准并继续</text>

  <text x="64" y="384" font-size="10.5" fill="#94a3b8">MacBook Pro · DSH · 2 分钟前 · 也可在 Web 总控台处理</text>
</svg>
