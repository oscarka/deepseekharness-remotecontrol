<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="DSH Remote Control">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="960" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="48%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="aurora" cx="84%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="76%" cy="80%" r="46%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="160" y1="260" x2="770" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="chevronGrad" x1="260" y1="450" x2="500" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="490" y1="686" x2="668" y2="686" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-16%" y="-12%" width="134%" height="134%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#050B1A" flood-opacity="0.44"/>
    </filter>
  </defs>

  <!-- Rich Opaque Gradient Canvas -->
  <rect x="24" y="24" width="976" height="976" rx="228" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="228" fill="url(#aurora)"/>
  <rect x="24" y="24" width="976" height="976" rx="228" fill="url(#emeraldGlow)"/>

  <!-- Crisp Wireless Control Waves (cleanly separated in upper-right sky) -->
  <path d="M 690 124 A 210 210 0 0 1 900 334" fill="none" stroke="#7DD3FC" stroke-width="36" stroke-linecap="round" opacity="0.92"/>
  <path d="M 690 202 A 132 132 0 0 1 822 334" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>

  <!-- Elevated Command Console Card -->
  <g filter="url(#cardShadow)">
    <rect x="148" y="276" width="620" height="544" rx="124" fill="url(#cardBg)"/>
  </g>

  <!-- Console Header Dots & Live Connected Pill -->
  <circle cx="252" cy="374" r="18" fill="#93C5FD"/>
  <circle cx="310" cy="374" r="18" fill="#60A5FA"/>
  <rect x="564" y="346" width="142" height="56" rx="28" fill="#DCFCE7"/>
  <circle cx="602" cy="374" r="13" fill="#10B981"/>
  <rect x="630" y="365" width="52" height="18" rx="9" fill="#059669" opacity="0.88"/>

  <!-- Bold >_ Prompt Symbol -->
  <path d="M 278 478 L 424 584 L 278 690" fill="none" stroke="url(#chevronGrad)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="482" y1="686" x2="646" y2="686" stroke="url(#cursorGrad)" stroke-width="74" stroke-linecap="round"/>
</svg>
