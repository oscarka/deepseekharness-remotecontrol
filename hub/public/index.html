<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DSH 远控" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>DeepSeek Harness 自托管全功能总控台</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --subtle-hover: #e2e8f0;
      --border: #e2e8f0;
      --hairline: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --amber: #f59e0b;
      --amber-soft: #fffbeb;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: #cbd5e1;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部预览/布局切换器（电脑端可在「📱 iPhone 手机视图」与「🖥️ 电脑双栏同屏视图」间一键切换；真机手机端自动隐藏） */
    .preview-toolbar {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 5px 8px 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    .preview-toolbar button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preview-toolbar button.active {
      background: #ffffff;
      color: #0f172a;
    }
    @media (max-width: 768px) {
      .preview-toolbar { display: none; }
      html, body { background: var(--surface); }
    }

    /* ==================== 整体容器：支持「iPhone 单栏」与「桌面双栏」无缝切换 ==================== */
    .app-shell {
      width: 100%;
      max-width: 100vw;
      height: 100dvh;
      background: var(--surface);
      display: flex;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    @media (min-width: 769px) {
      body.PhoneFrameMode .app-shell {
        max-width: 402px;
        height: 856px;
        margin: calc((100dvh - 856px) / 2) auto;
        border-radius: 46px;
        border: 11px solid #0f172a;
        box-shadow: 0 30px 80px -15px rgba(15, 23, 42, 0.45);
      }
    }

    .primary-pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      min-width: 0;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    @media (min-width: 769px) {
      body.DesktopSplitMode .primary-pane {
        width: 390px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
      }
    }

    .chat-fullscreen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 45;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }
    .chat-fullscreen.open {
      transform: translateX(0);
    }

    @media (min-width: 769px) {
      body.DesktopSplitMode .chat-fullscreen {
        position: relative;
        inset: auto;
        flex: 1;
        transform: none !important;
        transition: none;
        z-index: 10;
      }
      body.DesktopSplitMode .back-btn {
        display: none !important;
      }
    }

    .desktop-stage-tabs {
      display: none;
      background: var(--subtle);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }
    @media (min-width: 769px) {
      body.DesktopSplitMode .desktop-stage-tabs {
        display: inline-flex;
      }
      body.DesktopSplitMode .mobile-only-file-btn {
        display: none !important;
      }
    }
    .stage-seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .stage-seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* ==================== 1. 唯一极简顶栏 ==================== */
    .top-bar {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .host-switcher-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border: 1px solid transparent;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      max-width: 235px;
    }
    .host-switcher-btn:hover { background: var(--subtle-hover); }
    .host-switcher-btn:active { transform: scale(0.97); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
      flex-shrink: 0;
    }
    .status-dot.offline {
      background: #94a3b8;
      box-shadow: none;
    }
    .host-switcher-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .host-switcher-caret {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .new-chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: all 0.15s;
    }
    .new-chat-btn:hover { background: var(--primary-hover); }
    .new-chat-btn:active { transform: scale(0.96); }

    /* ==================== 2. 搜索栏 + 智能筛选胶囊条（严格锁死宽度） ==================== */
    .search-and-filter {
      background: var(--surface);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .search-box-wrap {
      padding: 8px 14px 4px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border-radius: 11px;
      padding: 7px 11px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .search-box:focus-within {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 15px;
      color: var(--text);
    }
    .search-clear {
      border: none;
      background: #cbd5e1;
      color: #fff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .filter-strip {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      border: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-pill.active {
      background: var(--text);
      color: #fff;
      font-weight: 600;
    }
    .filter-pill.smart-pill {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .filter-pill.smart-pill.active {
      background: var(--primary);
      color: #fff;
    }
    .filter-pill .count {
      font-size: 11px;
      opacity: 0.75;
    }

    /* ==================== 3. 跨设备实时动态置顶条 ==================== */
    .live-activity-bar {
      margin: 10px 14px 4px;
      padding: 11px 13px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.08);
    }
    .live-activity-left {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .live-activity-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-activity-desc {
      font-size: 12px;
      color: #b45309;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .live-activity-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mini-approve-btn {
      border: none;
      background: #d97706;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-approve-btn.ghost {
      background: rgba(255, 255, 255, 0.75);
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    /* ==================== 4. 微信 / Claude 风格极简通栏列表 ==================== */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    .file-loading-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid #cbd5e1;
      border-top-color: var(--primary);
      animation: fileSpin 0.8s linear infinite;
    }
    @keyframes fileSpin { to { transform: rotate(360deg); } }

    .session-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px 14px 16px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface);
      cursor: pointer;
      transition: background 0.12s;
      width: 100%;
      min-width: 0;
    }
    .session-row.pinned-row {
      background: #fafcff;
    }
    .session-row:hover { background: #f8fafc; }
    @media (min-width: 769px) {
      body.DesktopSplitMode .session-row.selected-desktop {
        background: var(--primary-soft);
      }
    }

    .session-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .session-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .session-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .pin-tag {
      font-size: 12px;
      flex-shrink: 0;
    }

    .session-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-right-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 12px;
      color: var(--muted);
    }

    .badge-running {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #059669;
      background: var(--green-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-approval {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #d97706;
      background: var(--amber-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .session-sub-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
      min-width: 0;
    }

    .host-mini-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .project-mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      padding: 1.5px 6px;
      border-radius: 5px;
      flex-shrink: 0;
      max-width: 132px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .harness-mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
      padding: 1.5px 5.5px;
      border-radius: 5px;
      flex-shrink: 0;
      white-space: nowrap;
      color: #4338ca;
      background: #e0e7ff;
    }
    .harness-mini-tag.agy {
      color: #4338ca;
      background: #e0e7ff;
    }

    .session-preview-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .row-more-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .row-more-btn:hover {
      background: var(--subtle);
      color: var(--text);
    }

    /* ==================== 5. 底部 3-Tab 导航栏 ==================== */
    .bottom-tabs {
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      flex-shrink: 0;
    }

    .tab-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }
    .tab-btn .icon { font-size: 18px; line-height: 1; }
    .tab-btn.active { color: var(--primary); }

    /* ==================== 6. 聊天视图 ==================== */
    .chat-navbar {
      height: 54px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-nav-center {
      flex: 1;
      min-width: 0;
    }
    .chat-nav-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-nav-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-pill-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-pill-btn:hover { background: var(--subtle); }

    .chat-switch-alert {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 6px 12px;
      font-size: 12px;
      color: #92400e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .bubble {
      max-width: 88%;
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.7;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 5px;
      white-space: pre-wrap;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    /* AI 回复里的简单 Markdown 排版（标题/列表/引用/代码/链接） */
    .md-body { white-space: normal; }
    .md-body p { margin: 0 0 9px; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body .md-h1 { font-size: 16.5px; font-weight: 700; margin: 14px 0 7px; line-height: 1.4; }
    .md-body .md-h2 { font-size: 15.5px; font-weight: 700; margin: 13px 0 6px; line-height: 1.4; }
    .md-body .md-h3 { font-size: 15px; font-weight: 700; margin: 12px 0 5px; line-height: 1.4; }
    .md-body .md-h4,
    .md-body .md-h5,
    .md-body .md-h6 { font-size: 14.5px; font-weight: 700; margin: 10px 0 4px; }
    .md-body ul,
    .md-body ol { margin: 4px 0 10px; padding-left: 22px; }
    .md-body li { margin: 3px 0; }
    .md-body blockquote {
      margin: 10px 0;
      padding: 4px 10px;
      border-left: 3px solid #bfdbfe;
      background: var(--subtle);
      color: var(--text-secondary);
      border-radius: 0 8px 8px 0;
    }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .md-body a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
    .md-body code {
      background: var(--subtle);
      padding: 1.5px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      color: #0f172a;
    }
    .md-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .md-body .code-card { margin: 10px 0; }
    .md-body .md-table-wrap { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
    .md-body table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .md-body th,
    .md-body td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
    .md-body th { background: var(--subtle); font-weight: 600; white-space: nowrap; }
    .md-body > *:first-child { margin-top: 0; }

    .thought-box {
      margin-bottom: 9px;
      background: var(--subtle);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .thought-box summary {
      cursor: pointer;
      font-weight: 600;

  <!-- 顶部轻提示 Toast -->
