  <style>#app:not(:empty) + #dshBootSplash { display: none !important; }</style>
  <script>
    (function () {
      // Parallel HTTP/2 bootstrap: start fetching /api/state?lite=1 at T=0ms simultaneously with
      // downloading index-*.js & index-*.css instead of waiting sequentially for JS parse!
      try {
        var _tk = localStorage.getItem('dsh_hub_token');
        var _sp = new URLSearchParams(location.search);
        if (_tk && !_sp.get('token') && !_sp.get('pair')) {
          window.__dshPreloadState = {
            token: _tk,
            startedAt: Date.now(),
            promise: fetch('/api/state?lite=1', {
              headers: { 'authorization': 'Bearer ' + _tk, 'x-hub-token': _tk }
            }).then(function (r) {
              if (r.status === 401) return { __status: 401 };
              if (!r.ok) return null;
              return r.json().then(function (d) { return { __status: 200, data: d }; });
            }).catch(function () { return null; })
          };
        }
      } catch (e) {}
      function recoverAssetFailure() {
        try {
          var last = Number(sessionStorage.getItem('dsh_boot_retry_ts') || 0);
          if (Date.now() - last > 20000) {
            sessionStorage.setItem('dsh_boot_retry_ts', String(Date.now()));
            var u = new URL(location.href);
            u.searchParams.set('_r', String(Date.now()).slice(-6));
            location.replace(u.toString());
            return;
          }
        } catch (e) {}
        var btn = document.getElementById('dshBootRetryBtn');
        if (btn) btn.style.display = 'inline-flex';
      }
      window.addEventListener('vite:preloadError', function (ev) {
        if (ev && ev.preventDefault) ev.preventDefault();
        recoverAssetFailure();
      });
      window.addEventListener('error', function (ev) {
        var t = ev && ev.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          var appEl = document.getElementById('app');
          if (!appEl || !appEl.children.length) recoverAssetFailure();
        }
      }, true);
      setTimeout(function () {
        var appEl = document.getElementById('app');
        var btn = document.getElementById('dshBootRetryBtn');
        if (btn && (!appEl || !appEl.children.length)) {
          btn.style.display = 'inline-flex';
        }
      }, 6500);
    })();
  </script>

    <div style="font-size:15px;font-weight:700;color:#0f172a;">DSH 远控台连接中…</div>
    <div style="font-size:12.5px;color:#64748b;margin-top:6px;">正在同步加密会话与静态资源，请稍候</div>

  </div>
