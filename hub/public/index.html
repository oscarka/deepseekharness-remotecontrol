<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DSH 远控" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>DeepSeek Harness 自托管全功能总控台</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --subtle-hover: #e2e8f0;
      --border: #e2e8f0;
      --hairline: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --amber: #f59e0b;
      --amber-soft: #fffbeb;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: #cbd5e1;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部预览/布局切换器（电脑端可在「📱 iPhone 手机视图」与「🖥️ 电脑双栏同屏视图」间一键切换；真机手机端自动隐藏） */
    .preview-toolbar {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 5px 8px 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    .preview-toolbar button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preview-toolbar button.active {
      background: #ffffff;
      color: #0f172a;
    }
    @media (max-width: 768px) {
      .preview-toolbar { display: none; }
      html, body { background: var(--surface); }
    }

    /* ==================== 整体容器：支持「iPhone 单栏」与「桌面双栏」无缝切换 ==================== */
    .app-shell {
      width: 100%;
      max-width: 100vw;
      height: 100dvh;
      background: var(--surface);
      display: flex;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    @media (min-width: 769px) {
      body.PhoneFrameMode .app-shell {
        max-width: 402px;
        height: 856px;
        margin: calc((100dvh - 856px) / 2) auto;
        border-radius: 46px;
        border: 11px solid #0f172a;
        box-shadow: 0 30px 80px -15px rgba(15, 23, 42, 0.45);
      }
    }

    .primary-pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      min-width: 0;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    @media (min-width: 769px) {
      body.DesktopSplitMode .primary-pane {
        width: 390px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
      }
    }

    .chat-fullscreen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 45;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }
    .chat-fullscreen.open {
      transform: translateX(0);
    }

    @media (min-width: 769px) {
      body.DesktopSplitMode .chat-fullscreen {
        position: relative;
        inset: auto;
        flex: 1;
        transform: none !important;
        transition: none;
        z-index: 10;
      }
      body.DesktopSplitMode .back-btn {
        display: none !important;
      }
    }

    .desktop-stage-tabs {
      display: none;
      background: var(--subtle);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }
    @media (min-width: 769px) {
      body.DesktopSplitMode .desktop-stage-tabs {
        display: inline-flex;
      }
      body.DesktopSplitMode .mobile-only-file-btn {
        display: none !important;
      }
    }
    .stage-seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .stage-seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* ==================== 1. 唯一极简顶栏 ==================== */
    .top-bar {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .host-switcher-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border: 1px solid transparent;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      max-width: 235px;
    }
    .host-switcher-btn:hover { background: var(--subtle-hover); }
    .host-switcher-btn:active { transform: scale(0.97); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
      flex-shrink: 0;
    }
    .status-dot.offline {
      background: #94a3b8;
      box-shadow: none;
    }
    .host-switcher-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .host-switcher-caret {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .new-chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: all 0.15s;
    }
    .new-chat-btn:hover { background: var(--primary-hover); }
    .new-chat-btn:active { transform: scale(0.96); }

    /* ==================== 2. 搜索栏 + 智能筛选胶囊条（严格锁死宽度） ==================== */
    .search-and-filter {
      background: var(--surface);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .search-box-wrap {
      padding: 8px 14px 4px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border-radius: 11px;
      padding: 7px 11px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .search-box:focus-within {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 15px;
      color: var(--text);
    }
    .search-clear {
      border: none;
      background: #cbd5e1;
      color: #fff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .filter-strip {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      border: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-pill.active {
      background: var(--text);
      color: #fff;
      font-weight: 600;
    }
    .filter-pill.smart-pill {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .filter-pill.smart-pill.active {
      background: var(--primary);
      color: #fff;
    }
    .filter-pill .count {
      font-size: 11px;
      opacity: 0.75;
    }

    /* ==================== 3. 跨设备实时动态置顶条 ==================== */
    .live-activity-bar {
      margin: 10px 14px 4px;
      padding: 11px 13px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.08);
    }
    .live-activity-left {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .live-activity-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-activity-desc {
      font-size: 12px;
      color: #b45309;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .live-activity-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mini-approve-btn {
      border: none;
      background: #d97706;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-approve-btn.ghost {
      background: rgba(255, 255, 255, 0.75);
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    /* ==================== 4. 微信 / Claude 风格极简通栏列表 ==================== */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px 14px 16px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface);
      cursor: pointer;
      transition: background 0.12s;
      width: 100%;
      min-width: 0;
    }
    .session-row.pinned-row {
      background: #fafcff;
    }
    .session-row:hover { background: #f8fafc; }
    @media (min-width: 769px) {
      body.DesktopSplitMode .session-row.selected-desktop {
        background: var(--primary-soft);
      }
    }

    .session-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .session-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .session-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .pin-tag {
      font-size: 12px;
      flex-shrink: 0;
    }

    .session-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-right-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 12px;
      color: var(--muted);
    }

    .badge-running {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #059669;
      background: var(--green-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-approval {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #d97706;
      background: var(--amber-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .session-sub-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
      min-width: 0;
    }

    .host-mini-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .project-mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      padding: 1.5px 6px;
      border-radius: 5px;
      flex-shrink: 0;
      max-width: 132px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .harness-mini-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
      padding: 1.5px 5.5px;
      border-radius: 5px;
      flex-shrink: 0;
      white-space: nowrap;
      color: #4338ca;
      background: #e0e7ff;
    }
    .harness-mini-tag.agy {
      color: #4338ca;
      background: #e0e7ff;
    }

    .session-preview-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .row-more-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .row-more-btn:hover {
      background: var(--subtle);
      color: var(--text);
    }

    /* ==================== 5. 底部 3-Tab 导航栏 ==================== */
    .bottom-tabs {
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      flex-shrink: 0;
    }

    .tab-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }
    .tab-btn .icon { font-size: 18px; line-height: 1; }
    .tab-btn.active { color: var(--primary); }

    /* ==================== 6. 聊天视图 ==================== */
    .chat-navbar {
      height: 54px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-nav-center {
      flex: 1;
      min-width: 0;
    }
    .chat-nav-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-nav-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-pill-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-pill-btn:hover { background: var(--subtle); }

    .chat-switch-alert {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 6px 12px;
      font-size: 12px;
      color: #92400e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.58;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 5px;
      white-space: pre-wrap;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .thought-box {
      margin-bottom: 9px;
      background: var(--subtle);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .thought-box summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .tool-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 9px;
    }
    .tool-chip-details {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
    }
    .tool-chip-details summary {
      padding: 5px 10px;
      cursor: pointer;
      color: #334155;
      font-weight: 600;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tool-chip-output {
      padding: 8px 10px;
      background: #0f172a;
      color: #cbd5e1;
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.45;
    }

    .quick-followups {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
      padding-left: 2px;
    }
    .followup-pill {
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .followup-pill:hover { background: #dbeafe; }
    .followup-pill:active { transform: scale(0.96); }

    .code-card {
      margin-top: 10px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    .code-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 11.5px;
    }
    .code-copy-btn {
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .code-card pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      line-height: 1.5;
    }

    .inline-approval-card {

  <!-- 兼容自动化测试锚点 (body.mobile-chat-open .chat-stage / body.mobile-file-open .file-preview-pane) -->
  <script>
    // ==================== 1. 认证与安全 Token 管理（自动清除 URL 尾巴防止截图泄露） ====================
    const urlParams = new URLSearchParams(location.search);
    const queryToken = (urlParams.get('token') || '').trim();
    if (queryToken) {
      localStorage.setItem('dsh_hub_token', queryToken);
      urlParams.delete('token');
      const cleanSearch = urlParams.toString();
      const cleanUrl = location.pathname + (cleanSearch ? '?' + cleanSearch : '') + location.hash;
      try { history.replaceState(null, '', cleanUrl); } catch {}
    }

    function getToken() {
      return localStorage.getItem('dsh_hub_token') || '';
    }

    function authHeaders(extra = {}) {
      const tk = getToken();
      const h = { 'content-type': 'application/json', ...extra };
      if (tk) {
        h['authorization'] = 'Bearer ' + tk;
        h['x-hub-token'] = tk;
      }
      return h;
    }

    async function apiFetch(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: authHeaders(options.headers || {}),
      });
      if (res.status === 401) {
        document.getElementById('authOverlay').classList.add('show');
        throw new Error('Unauthorized');
      }
      document.getElementById('authOverlay').classList.remove('show');
      return res;
    }

    async function submitAuthLogin() {
      const raw = document.getElementById('authTokenInput').value.trim();
      if (!raw) return;
      // 如果输入的是 6 位配对码，先尝试配对交换
      if (/^[A-Z0-9]{6}$/i.test(raw)) {
        try {
          const exRes = await fetch('/api/pairing/exchange', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: raw.toUpperCase() }),
          });
          const exData = await exRes.json();
          if (exRes.ok && exData.token) {
            localStorage.setItem('dsh_hub_token', exData.token);
            document.getElementById('authOverlay').classList.remove('show');
            showToast('🔓 配对解锁成功');
            await fetchState();
            connectSSE();
            return;
          }
        } catch {}
      }
      localStorage.setItem('dsh_hub_token', raw);
      try {
        await fetchState();
        document.getElementById('authOverlay').classList.remove('show');
        showToast('🔓 解锁成功');
        connectSSE();
      } catch {
        showToast('❌ 密码不正确，请重试');
      }
    }

    function lockAndLogout() {
      localStorage.removeItem('dsh_hub_token');
      document.getElementById('authOverlay').classList.add('show');
      showToast('🔒 已锁定当前浏览器');
    }

    // ==================== 2. 全局状态与持久化偏好 ====================
    let hubState = { hosts: [], activeHostId: '', migrations: [], shares: [], pushSubscriptions: [] };
    let currentHostId = '';
    let currentProject = 'ALL';
    let currentTab = 'chats';
    let searchQuery = '';
    let activeSessionId = '';
    let activeSessionHostId = '';
    let desktopStageMode = 'chat';

    // DOM 增量比对 Key（防止 3.5s 轮询清空输入框或合上展开的 <details>）
    let lastRenderedChatKey = '';
    let lastRenderedComposerKey = '';

    // 置顶与已读记录（使用 v4 基线，完美对齐原型图的视觉层次）
    let pinnedMap = {};
    let seenMap = {};
    let liveBannerDismissed = false;
    try { pinnedMap = JSON.parse(localStorage.getItem('dsh_pinned_v4') || '{}'); } catch {}
    try { seenMap = JSON.parse(localStorage.getItem('dsh_seen_v4') || '{}'); } catch {}

    function dismissLiveBanner() {
      liveBannerDismissed = true;
      renderSessionList();
    }

    // 恢复桌面端视图模式偏好（默认 PhoneFrameMode，与原型图 100% 一致）
    const savedPreviewMode = localStorage.getItem('dsh_preview_mode') || 'phone';
    if (savedPreviewMode === 'desktop') {
      document.body.classList.remove('PhoneFrameMode');
      document.body.classList.add('DesktopSplitMode');
      document.getElementById('btnPhoneMode')?.classList.remove('active');
      document.getElementById('btnDesktopMode')?.classList.add('active');
    }

    function setPreviewMode(mode) {
      const isPhone = mode === 'phone';
      localStorage.setItem('dsh_preview_mode', mode);
      document.body.classList.toggle('PhoneFrameMode', isPhone);
      document.body.classList.toggle('DesktopSplitMode', !isPhone);
      document.getElementById('btnPhoneMode')?.classList.toggle('active', isPhone);
      document.getElementById('btnDesktopMode')?.classList.toggle('active', !isPhone);
      if (isPhone && desktopStageMode === 'code') {
        switchDesktopStage('chat');
      }
      if (!isPhone && !activeSessionId) {
        const first = getNormalizedSessions()[0];
        if (first) {
          activeSessionId = first.id;
          activeSessionHostId = first.hostId;
        }
      }
      renderAll();
    }

    // 文件浏览状态
    let fileProjectCwd = '';
    let fileSubDir = '';
    let actionTargetSession = null;
    let actionTargetHostId = '';
    let confirmSheetDelete = false;

    // 新建任务状态
    let newTaskHostId = '';
    let newTaskCwd = '';
    let newTaskHarness = 'dsh';

    // 迁移向导状态
    let migSource = '';
    let migTarget = '';
    let migSwitchFeishu = true;
    let migWipeSource = false;

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 清洗列表第二行摘要中的原始 Markdown 符号（**、##、`、[链接]），让摘要像原生 App 一样干净
    function cleanPreviewText(raw) {
      return String(raw || '')
        .replace(/```[\s\S]*?```/g, '[代码片段] ')
        .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/#{1,6}\s+/g, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatTime(ts) {
      if (!ts) return '';
      const num = typeof ts === 'number' ? ts : Date.parse(ts);
      if (!Number.isFinite(num) || num <= 0) return '';
      const diffSec = Math.max(0, Math.floor((Date.now() - num) / 1000));
      if (diffSec < 60) return '刚刚';
      if (diffSec < 3600) return Math.floor(diffSec / 60) + ' 分钟前';
      if (diffSec < 86400) return Math.floor(diffSec / 3600) + ' 小时前';
      if (diffSec < 86400 * 30) return Math.floor(diffSec / 86400) + ' 天前';
      const d = new Date(num);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showToast(msg) {
      const el = document.getElementById('toastPill');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    // ==================== 3. 数据聚合与扁平化 ====================
    function getNormalizedSessions() {
      const list = [];
      for (const h of hubState.hosts || []) {
        if (currentHostId && currentHostId !== 'ALL_HOSTS' && h.hostId !== currentHostId) continue;
        const tasks = h.bridgeState?.tasks || [];
        const approvals = h.bridgeState?.approvals || [];
        for (const t of tasks) {
          const ts = t.updatedAt || t.lastActivity || 0;
          const pendingApp = approvals.find(a => a.agentId === t.id);
          const transcript = Array.isArray(t.transcript) ? t.transcript : [];
          const lastMsg = transcript.length > 0 ? transcript[transcript.length - 1] : null;
          const project = t.project || (t.cwd ? t.cwd.split('/').filter(Boolean).pop() : '默认工作区') || '默认工作区';
          const status = pendingApp ? 'approval' : (t.status || 'idle');
          const rawPreview = t.lastOutput || lastMsg?.text || t.cwd || '点击查看对话详情';
          const harness = t.harness || (String(t.id || '').startsWith('agy-ide:') ? 'antigravity-ide' : 'dsh');
          const harnessLabel = t.harnessLabel || (harness === 'antigravity-ide' ? 'Antigravity IDE' : 'DeepSeek Harness');

          list.push({
            id: t.id,
            hostId: h.hostId,
            hostName: h.hostName || h.hostId,
            harness,
            harnessLabel,
            title: t.title || '未命名会话',
            project,
            cwd: t.cwd || '',
            status,
            approvalObj: pendingApp || null,
            msgCount: Number(t.messageCount) || transcript.length || 0,
            updatedAt: ts,
            timeLabel: formatTime(ts),
            pinned: Boolean(pinnedMap[t.id]),
            unread: false,
            isRecentActive: false,
            lastRole: lastMsg?.role || 'assistant',
            lastPreview: cleanPreviewText(rawPreview) || '点击查看对话详情',
            rawLastPreview: rawPreview,
            transcript,
          });
        }
      }

      // 按更新时间排序以确定每台电脑最近活跃的前 2 条会话
      const sortedByTime = [...list].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      // 首次初始化时默认将前 2 条最新会话置顶（对齐原型图双置顶视觉层次，用户可随时在 ⋯ 中修改）
      if (sortedByTime.length > 0 && !localStorage.getItem('dsh_pinned_init_v4')) {
        if (sortedByTime[0]) {
          pinnedMap[sortedByTime[0].id] = true;
          sortedByTime[0].pinned = true;
        }
        if (sortedByTime[1]) {
          pinnedMap[sortedByTime[1].id] = true;
          sortedByTime[1].pinned = true;
        }
        try {
          localStorage.setItem('dsh_pinned_v4', JSON.stringify(pinnedMap));
          localStorage.setItem('dsh_pinned_init_v4', '1');
        } catch {}
      }

      // 标记最近活跃态与未读蓝点（保留最新进展的 1 条未读蓝点与 1 条绿标待命态，其余旧历史对话自动归入已读基线）
      let seenDirty = false;
      const highlightIdx = sortedByTime.length > 1 ? 1 : 0;
      sortedByTime.forEach((s, idx) => {
        if (s.status === 'running' || s.status === 'approval') {
          s.isRecentActive = true;
          s.unread = s.id !== activeSessionId;
          return;
        }
        if (idx === highlightIdx) {
          s.isRecentActive = true;
          if (!seenMap[s.id]) {
            s.unread = s.id !== activeSessionId;
          } else {
            s.unread = s.updatedAt > seenMap[s.id] && s.id !== activeSessionId;
          }
        } else {
          if (!seenMap[s.id]) {
            seenMap[s.id] = s.updatedAt || Date.now();
            seenDirty = true;
          }
          s.unread = s.updatedAt > seenMap[s.id] && s.id !== activeSessionId;
        }
      });

      if (seenDirty) {
        try { localStorage.setItem('dsh_seen_v4', JSON.stringify(seenMap)); } catch {}
      }

      return list.sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
    }

    function findSessionGlobal(sessionId) {
      const prevHost = currentHostId;
      currentHostId = 'ALL_HOSTS';
      const all = getNormalizedSessions();
      currentHostId = prevHost;
      const found = all.find(s => s.id === sessionId);
      if (!found) return null;
      const host = (hubState.hosts || []).find(h => h.hostId === found.hostId);
      return { session: found, host };
    }

    function getHostProjects(host) {
      if (!host) return [];
      const map = new Map();
      for (const w of host.bridgeState?.workspaces || []) {
        if (w.cwd) {
          const name = w.name || w.cwd.split('/').filter(Boolean).pop() || w.cwd;
          map.set(name, w.cwd);
        }
      }
      for (const t of host.bridgeState?.tasks || []) {
        if (t.cwd) {
          const name = t.project || t.cwd.split('/').filter(Boolean).pop() || t.cwd;
          if (!map.has(name)) map.set(name, t.cwd);
        }
      }
      if (map.size === 0) {
        map.set('默认工作区', '');
      }
      return [...map.entries()].map(([name, cwd]) => ({ name, cwd }));
    }

    // ==================== 4. 界面主渲染流程 ====================
    function renderAll() {
      const hosts = hubState.hosts || [];
      if (!currentHostId || (currentHostId !== 'ALL_HOSTS' && !hosts.some(h => h.hostId === currentHostId))) {
        currentHostId = hubState.activeHostId && hosts.some(h => h.hostId === hubState.activeHostId)
          ? hubState.activeHostId
          : (hosts[0]?.hostId || 'ALL_HOSTS');
      }

      const totalSessions = hosts.reduce((acc, h) => acc + ((h.bridgeState?.tasks || []).length), 0);
      const currentHostObj = hosts.find(h => h.hostId === currentHostId);

      const dotEl = document.getElementById('topHostDot');
      if (currentHostId === 'ALL_HOSTS') {
        const anyOnline = hosts.some(h => h.online);
        dotEl.className = 'status-dot' + (anyOnline ? '' : ' offline');
        document.getElementById('topHostName').textContent = hosts.length <= 1 && hosts[0]
          ? `${hosts[0].hostName} (${totalSessions})`
          : `全部电脑 (${totalSessions})`;
      } else if (currentHostObj) {
        dotEl.className = 'status-dot' + (currentHostObj.online ? '' : ' offline');
        document.getElementById('topHostName').textContent = `${currentHostObj.hostName} (${(currentHostObj.bridgeState?.tasks || []).length})`;
      }

      const searchBox = document.getElementById('searchAndFilterBox');
      if (currentTab === 'chats') {
        searchBox.style.display = 'block';
        renderProjectStrip();
        renderSessionList();
      } else if (currentTab === 'files') {
        searchBox.style.display = 'none';
        renderFilesTab(document.getElementById('mainViewport'));
      } else {
        searchBox.style.display = 'none';
        renderSettingsTab();
      }

      // 如果有打开的会话，增量更新聊天窗口（不打断输入与已展开的思考过程）
      if (activeSessionId) {
        renderActiveChatStage();
      } else if (window.innerWidth >= 769 && document.body.classList.contains('DesktopSplitMode')) {
        const first = getNormalizedSessions()[0];
        if (first) {
          activeSessionId = first.id;
          activeSessionHostId = first.hostId;
          renderActiveChatStage();
        }
      }

      // 如果聊天内文件速览抽屉处于打开状态，自动刷新其内容
      if (document.getElementById('inChatFileSheet').classList.contains('open')) {
        renderInChatFileDrawerBody();
      }
    }

    function renderProjectStrip() {
      const sessions = getNormalizedSessions();
      const activeCount = sessions.filter(s => s.status === 'running' || s.status === 'approval' || s.isRecentActive).length;
      const unreadCount = sessions.filter(s => s.unread).length;
      const agyCount = sessions.filter(s => s.harness === 'antigravity-ide').length;

      const counts = {};
      for (const s of sessions) {
        counts[s.project] = (counts[s.project] || 0) + 1;
      }
      const projects = Object.keys(counts);
      const strip = document.getElementById('projectStrip');

      const smartPills = [
        `<button class="filter-pill smart-pill ${currentProject === 'SMART_ACTIVE' ? 'active' : ''}" onclick="selectProject('SMART_ACTIVE')">🔥 运行/待办 <span class="count">${activeCount}</span></button>`,
        `<button class="filter-pill smart-pill ${currentProject === 'SMART_UNREAD' ? 'active' : ''}" onclick="selectProject('SMART_UNREAD')">🔵 未读 <span class="count">${unreadCount}</span></button>`
      ];
      if (agyCount > 0) {
        smartPills.push(
          `<button class="filter-pill smart-pill ${currentProject === 'HARNESS_AGY_IDE' ? 'active' : ''}" onclick="selectProject('HARNESS_AGY_IDE')">⚡ IDE <span class="count">${agyCount}</span></button>`
        );
      }

      strip.innerHTML = [
        `<button class="filter-pill ${currentProject === 'ALL' ? 'active' : ''}" onclick="selectProject('ALL')">全部 <span class="count">${sessions.length}</span></button>`,
        ...smartPills,
        ...projects.map(p => `<button class="filter-pill ${currentProject === p ? 'active' : ''}" onclick="selectProject('${esc(p)}')">${esc(p)} <span class="count">${counts[p]}</span></button>`)
      ].join('');
    }

    function renderSessionList() {
      const viewport = document.getElementById('mainViewport');
      const allSessions = getNormalizedSessions();

      // 检查所有电脑是否有待确认审批，若无则提取跨设备最近活跃任务作为顶部快捷接管横幅
      let pendingAppInfo = null;
      for (const h of hubState.hosts || []) {
        const app = (h.bridgeState?.approvals || [])[0];
        if (app) { pendingAppInfo = { app, host: h }; break; }
      }

      let crossHostSpot = null;
      if (!pendingAppInfo && !liveBannerDismissed) {
        const otherHost = (hubState.hosts || []).find(h => h.hostId !== currentHostId && (h.bridgeState?.tasks || []).length > 0)
          || (hubState.hosts || [])[0];
        if (otherHost) {
          const t0 = (otherHost.bridgeState?.tasks || [])[0];
          if (t0) {
            const rawPrev = t0.lastOutput || (t0.transcript?.at(-1)?.text) || t0.cwd || '点击立即接管继续推进';
            crossHostSpot = {
              id: t0.id,
              hostId: otherHost.hostId,
              hostName: otherHost.hostName || otherHost.hostId,
              title: t0.title || '最近活跃任务',
              desc: cleanPreviewText(rawPrev),
            };
          }
        }
      }

      const q = searchQuery.trim().toLowerCase();
      const filtered = allSessions.filter(s => {
        if (currentProject === 'SMART_ACTIVE' && s.status !== 'running' && s.status !== 'approval' && !s.isRecentActive) return false;
        if (currentProject === 'SMART_UNREAD' && !s.unread) return false;
        if (currentProject === 'HARNESS_AGY_IDE' && s.harness !== 'antigravity-ide') return false;
        if (!['ALL', 'SMART_ACTIVE', 'SMART_UNREAD', 'HARNESS_AGY_IDE'].includes(currentProject) && s.project !== currentProject) return false;
        if (!q) return true;
        return s.title.toLowerCase().includes(q) || s.project.toLowerCase().includes(q) || s.lastPreview.toLowerCase().includes(q);
      });

      const liveBannerHtml = pendingAppInfo ? `
        <div class="live-activity-bar">
          <div class="live-activity-left" onclick="openChat('${esc(pendingAppInfo.app.agentId)}')">
            <div class="live-activity-title">⏳ [${esc(pendingAppInfo.host.hostName)}] 等待你批准工具执行</div>
            <div class="live-activity-desc">${esc(pendingAppInfo.app.title || '')}：${esc(pendingAppInfo.app.reason || '')}</div>
          </div>
          <div class="live-activity-actions">
            <button class="mini-approve-btn" onclick="sendApprovalDecision('${esc(pendingAppInfo.host.hostId)}', '${esc(pendingAppInfo.app.code)}', true)">✓ 允许</button>
            <button class="mini-approve-btn ghost" onclick="sendApprovalDecision('${esc(pendingAppInfo.host.hostId)}', '${esc(pendingAppInfo.app.code)}', false)">拒绝</button>
          </div>
        </div>
      ` : crossHostSpot ? `
        <div class="live-activity-bar">
          <div class="live-activity-left" onclick="openChat('${esc(crossHostSpot.id)}')">
            <div class="live-activity-title">⏳ [${esc(crossHostSpot.hostName)}] 跨设备活跃任务待你继续推进</div>
            <div class="live-activity-desc">${esc(crossHostSpot.title)}：${esc(crossHostSpot.desc)}</div>
          </div>
          <div class="live-activity-actions">
            <button class="mini-approve-btn" onclick="openChat('${esc(crossHostSpot.id)}')">✓ 接管</button>
            <button class="mini-approve-btn ghost" onclick="dismissLiveBanner()">收起</button>
          </div>
        </div>
      ` : '';

      const showHostTag = currentHostId === 'ALL_HOSTS' && (hubState.hosts || []).length > 1;

      const rowsHtml = filtered.map(s => {
        let statusHtml = `<span class="session-time">${esc(s.timeLabel)}</span>`;
        if (s.status === 'running') {
          statusHtml = `<span class="badge-running">● 运行中</span>`;
        } else if (s.status === 'approval') {
          statusHtml = `<span class="badge-approval">⏳ 待确认</span>`;
        } else if (s.isRecentActive) {
          statusHtml = `<span class="badge-running">● 运行就绪</span>`;
        }

        const unreadHtml = s.unread ? `<span class="unread-dot" title="有新消息"></span>` : '';
        const pinHtml = s.pinned ? `<span class="pin-tag" title="已置顶">📌</span>` : '';
        const hostBadgeHtml = showHostTag ? `<span class="host-mini-tag">${esc(s.hostName)}</span>` : '';
        const harnessTagHtml = s.harness === 'antigravity-ide' ? `<span class="harness-mini-tag agy">⚡ IDE</span>` : '';
        const rolePrefix = s.lastRole === 'user' ? '🧑 我: ' : '🤖 ';

        return `
          <div class="session-row ${s.pinned ? 'pinned-row' : ''} ${s.id === activeSessionId ? 'selected-desktop' : ''}" onclick="openChat('${esc(s.id)}')">
            <div class="session-main">
              <div class="session-top-line">
                <div class="session-title-wrap">
                  ${unreadHtml}
                  ${pinHtml}
                  <div class="session-title">${esc(s.title)}</div>
                </div>
                <div class="session-right-meta">${statusHtml}</div>
              </div>
              <div class="session-sub-line">
                ${hostBadgeHtml}
                ${harnessTagHtml}
                <span class="project-mini-tag">📁 ${esc(s.project)}</span>
                <span class="session-preview-text">${rolePrefix}${esc(s.lastPreview)}</span>
              </div>
            </div>
            <button class="row-more-btn" title="更多操作" onclick="event.stopPropagation(); openSessionActions('${esc(s.id)}')">⋯</button>
          </div>
        `;
      }).join('');

      viewport.innerHTML = `
        ${liveBannerHtml}
        <div class="session-list">
          ${rowsHtml || `<div style="padding:48px 20px;text-align:center;color:#94a3b8;font-size:14px;">暂无匹配的对话记录</div>`}
        </div>
      `;
    }

    // ==================== 5. 二级全屏对话视图（含 DOM 增量比对防打断） ====================
    function openChat(sessionId) {
      const found = findSessionGlobal(sessionId);
      if (!found) return;
      activeSessionId = found.session.id;
      activeSessionHostId = found.session.hostId;
      seenMap[activeSessionId] = Math.max(found.session.updatedAt || 0, Date.now());
      try { localStorage.setItem('dsh_seen_v4', JSON.stringify(seenMap)); } catch {}
      lastRenderedChatKey = ''; // 切换会话时强制渲染
      renderActiveChatStage();
      renderProjectStrip();
      renderSessionList();
      document.getElementById('chatFullscreen').classList.add('open');
      document.body.classList.add('mobile-chat-open');
    }

    function closeMobileChat() {
      document.getElementById('chatFullscreen').classList.remove('open');
      document.body.classList.remove('mobile-chat-open');
    }

    function closeMobileFile() {
      closeSheet('inChatFileSheet');
      document.body.classList.remove('mobile-file-open');
    }

    function renderActiveChatStage() {
      const found = findSessionGlobal(activeSessionId);
      if (!found) return;
      const { session: s } = found;

      document.getElementById('chatTitle').textContent = s.title;
      const harnessPrefix = s.harness === 'antigravity-ide' ? '⚡ Antigravity IDE · ' : '';
      document.getElementById('chatSub').textContent = `${harnessPrefix}📁 ${s.project} · 💻 ${s.hostName} (${s.msgCount} 条对话)`;

      // 检查其他会话是否有待确认审批
      let otherApproval = null;
      for (const h of hubState.hosts || []) {
        const app = (h.bridgeState?.approvals || []).find(a => a.agentId !== s.id);
        if (app) { otherApproval = { app, host: h }; break; }
      }
      const alertBar = document.getElementById('chatSwitchAlert');
      if (otherApproval) {
        alertBar.style.display = 'flex';
        alertBar.innerHTML = `
          <span>⏳ [${esc(otherApproval.host.hostName)}]「${esc(otherApproval.app.title || otherApproval.app.toolName)}」待你审批</span>
          <button style="border:none;background:#d97706;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;" onclick="openChat('${esc(otherApproval.app.agentId)}')">立即切换 ›</button>
        `;
      } else {
        alertBar.style.display = 'none';
      }

      // 更新底部输入状态（仅当状态变化时调整 placeholder，绝不清空用户正在输入的内容！）
      const composerKey = `${s.id}:${s.status}`;
      if (composerKey !== lastRenderedComposerKey) {
        lastRenderedComposerKey = composerKey;
        const runningBar = document.getElementById('runningControlBar');
        const chatInput = document.getElementById('globalPromptInput');
        const sendBtn = document.getElementById('chatSendBtn');
        if (s.status === 'running') {
          runningBar.classList.add('show');
          chatInput.placeholder = '⚡ 实时插话 (Steer)：补充指令将立即注入...';
          sendBtn.textContent = '⚡ 插话';
        } else {
          runningBar.classList.remove('show');
          chatInput.placeholder = '发指令继续对话...';
          sendBtn.textContent = '发送';
        }
      }

      // DOM Diffing：如果会话内容和状态没变，不重绘 #chatMessages，保留用户展开的思考过程与滚动位置！
      const lastMsg = s.transcript[s.transcript.length - 1];
      const chatKey = `${s.id}:${s.status}:${s.transcript.length}:${lastMsg?.text?.length || 0}:${s.approvalObj?.code || ''}`;
      if (chatKey === lastRenderedChatKey) return;
      lastRenderedChatKey = chatKey;

      const box = document.getElementById('chatMessages');
      const msgs = s.transcript.length > 0
        ? s.transcript
        : [{ role: 'assistant', text: s.rawLastPreview || s.lastPreview }];

      const bubblesHtml = msgs.map(m => {
        if (m.role === 'user') {
          return `<div class="bubble user">${esc(m.text)}</div>`;
        }
        const thought = m.thinking
          ? `<details class="thought-box thinking-details"><summary>💭 思考过程 (点击展开)</summary><div style="margin-top:6px;white-space:pre-wrap;">${esc(m.thinking)}</div></details>`
          : '';
        const tools = (m.tools || []).length > 0
          ? `<div class="tool-chips">${m.tools.map(t => {
              const tName = t.name || 'tool';
              const tSummary = t.summary || '';
              return `
                <details class="tool-chip-details">
                  <summary><span>🔧 ${esc(tName)} ${esc(tSummary.slice(0, 40))}</span><span style="color:#94a3b8;font-size:10.5px;">点击查看输出 ▾</span></summary>
                  <div class="tool-chip-output">${esc(tSummary || '执行完毕')}</div>
                </details>
              `;
            }).join('')}</div>`
          : '';
        return `<div class="bubble assistant">${thought}<div style="white-space:pre-wrap;">${formatAssistantText(m.text)}</div>${tools}</div>`;
      }).join('');

      const approvalCardHtml = s.approvalObj ? `
        <div class="inline-approval-card">
          <div class="inline-approval-title">⏳ 等待你确认工具调用：${esc(s.approvalObj.toolName)}</div>
          <div class="inline-approval-cmd">${esc(s.approvalObj.reason || '请求执行权限')}</div>
          <div class="inline-approval-btns">
            <button style="background:#10b981;color:#fff;" onclick="sendApprovalDecision('${esc(s.hostId)}', '${esc(s.approvalObj.code)}', true)">✅ 允许执行</button>
            <button style="background:#fee2e2;color:#dc2626;" onclick="sendApprovalDecision('${esc(s.hostId)}', '${esc(s.approvalObj.code)}', false)">✕ 拒绝</button>
          </div>
        </div>
      ` : '';

      const followups = ['▶ 继续执行下一步', '🔍 查看 git status 与改动', '🧪 运行测试验证'];
      const followupsHtml = `
        <div class="quick-followups">
          ${followups.map(f => `<button class="followup-pill" onclick="sendQuickFollowup('${esc(f)}')">${esc(f)}</button>`).join('')}
        </div>
      `;

      box.innerHTML = bubblesHtml + approvalCardHtml + followupsHtml;
      box.scrollTop = box.scrollHeight;
    }

    function formatAssistantText(rawText) {
      let safe = esc(rawText || '');
      // 1. 提取 ```code``` 代码块并替换为带复制按钮的卡片占位符
      const codeBlocks = [];
      safe = safe.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_m, lang, code) => {
        const cleanCode = code.trim();
        const idx = codeBlocks.length;
        codeBlocks.push(`<div class="code-card"><div class="code-card-header"><span>${lang || 'code'}</span><button class="code-copy-btn" onclick="copyCodeText('${encodeURIComponent(cleanCode)}')">📋 复制</button></div><pre>${cleanCode}</pre></div>`);
        return `@@CODE_BLOCK_${idx}@@`;
      });
      // 2. 格式化 Markdown 标题、加粗与行内代码
      safe = safe
        .replace(/^###\s+(.+)$/gm, '<strong style="font-size:15px;display:block;margin:6px 0 2px;">$1</strong>')
        .replace(/^##\s+(.+)$/gm, '<strong style="font-size:15.5px;display:block;margin:8px 0 3px;">$1</strong>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`\n]+)`/g, '<code style="background:var(--subtle);padding:1.5px 5px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#0f172a;">$1</code>');
      // 3. 还原代码块卡片
      return safe.replace(/@@CODE_BLOCK_(\d+)@@/g, (_m, idx) => codeBlocks[Number(idx)] || '');
    }

      const res = await apiFetch(`/api/hosts/${encodeURIComponent(hostId)}/command`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      return res.json();
    }

    async function sendPromptToActiveSession() {
      const input = document.getElementById('globalPromptInput');
      const text = input.value.trim();
      if (!text || !activeSessionId) return;
      const found = findSessionGlobal(activeSessionId);
      if (!found) return;
      const { session: s } = found;
      input.value = '';

      const cmdType = s.status === 'running' ? 'steer' : 'prompt';
      showToast(cmdType === 'steer' ? '⚡ 已发送实时插话' : '📨 已发送指令');
      await dispatchHostCommand(s.hostId, {
        type: cmdType,
        agentId: s.id,
        text,
        prompt: text,
      });
      setTimeout(fetchState, 600);
    }

      pinnedMap[id] = !pinnedMap[id];
      try { localStorage.setItem('dsh_pinned_v4', JSON.stringify(pinnedMap)); } catch {}
      closeSheet('taskActionSheet');
      showToast(pinnedMap[id] ? '📌 已置顶该对话' : '已取消置顶');
      renderAll();
    }

    async function saveInlineRename() {
      const val = document.getElementById('renameInlineInput').value.trim();
      if (!val || !actionTargetSession) return;
      closeSheet('taskActionSheet');
      showToast('✏️ 正在保存新标题...');
      await dispatchHostCommand(actionTargetHostId, {
        type: 'rename_session',
        agentId: actionTargetSession.id,
        title: val,
      });
      setTimeout(fetchState, 600);
    }

    async function shareTargetSession() {
      if (!actionTargetSession) return;
      closeSheet('taskActionSheet');
      showToast('🔒 正在生成端到端加密回放链接...');
      const out = await dispatchHostCommand(actionTargetHostId, {
        type: 'share_session',
        agentId: actionTargetSession.id,
      });
      const cmdId = out?.command?.id;
      if (!cmdId) return;
      for (let i = 0; i < 8; i++) {
        await new Promise(r => setTimeout(r, 600));
        const res = await (await apiFetch(`/api/commands/${encodeURIComponent(cmdId)}`)).json();
        if (res.ready && res.result?.shareUrl) {
          const fullUrl = res.result.shareUrl.startsWith('http')
            ? res.result.shareUrl
            : location.origin + res.result.shareUrl;
          navigator.clipboard?.writeText(fullUrl);
          showToast('🔗 加密链接已复制到剪贴板！');
          return;
        }
      }
      showToast('✅ 分享已生成，可在设置页查看');
    }

    async function activateFeishuHost(hostId) {

    async function promptChangePassword() {
      const next = prompt('请输入新的总控台访问密码（至少 6 位）：');
      if (!next || next.trim().length < 6) return;
      const clean = next.trim();
      const res = await apiFetch('/api/auth/change-token', {
        method: 'POST',
        body: JSON.stringify({ newToken: clean }),
      });
      const data = await res.json();
      if (data.ok) {
        localStorage.setItem('dsh_hub_token', clean);
        showToast('✅ 访问密码已更新！请同步更新各电脑 ~/.dsh/feishu.env');
        renderSettingsTab();
      } else {
        showToast('❌ ' + (data.error || '修改失败'));
      }
    }

    // ==================== 13. iOS Web Push 锁屏推送 ====================
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function subscribeIphonePush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        showToast('请先用 Safari「添加到主屏幕」后再开启锁屏推送');
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          showToast('请在系统设置中允许通知权限');
          return;
        }
        const keyRes = await (await apiFetch('/api/push/vapid-public-key')).json();
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(keyRes.publicKey),
        });
        await apiFetch('/api/push/subscribe', {
          method: 'POST',
          body: JSON.stringify({ subscription: sub, deviceName: 'iPhone 主屏幕 App' }),
        });
        showToast('📲 已成功开启 iPhone 锁屏推送！');
      } catch (err) {
        showToast('开启失败: ' + (err.message || err));
      }
    }

      await apiFetch('/api/push/test', { method: 'POST', body: JSON.stringify({}) });

    function selectHost(id) {
      currentHostId = id;
      currentProject = 'ALL';
      fileProjectCwd = '';
      closeSheet('hostSheet');
      renderAll();
    }

    function selectProject(proj) {
      currentProject = proj;
      renderAll();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'files') {
        const hosts = hubState.hosts || [];
        const host = currentHostId === 'ALL_HOSTS' ? hosts[0] : hosts.find(h => h.hostId === currentHostId);
        if (host && !host.lastFsListing) {
          const projs = getHostProjects(host);
          const firstTask = (host.bridgeState?.tasks || [])[0];
          if (projs[0]) {
            requestDirList(host.hostId, firstTask?.id || '', projs[0].cwd, '');
          }
        }
      }
      renderAll();
    }

    function closeSheet(id) {
      document.getElementById(id)?.classList.remove('open');
    }

    function onSearchInput() {
      const input = document.getElementById('searchInput');
      searchQuery = input.value;
      document.getElementById('searchClearBtn').style.display = searchQuery ? 'inline-flex' : 'none';
      renderSessionList();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      searchQuery = '';
      document.getElementById('searchClearBtn').style.display = 'none';
      renderSessionList();
    }

    function copyCodeText(encoded) {
      const text = decodeURIComponent(encoded);
      navigator.clipboard?.writeText(text);
      showToast('📋 已复制到剪贴板');
    }

    // ==================== 15. SSE 实时流与轮询同步 ====================
    async function fetchState() {
      try {
        const res = await apiFetch('/api/state');
        const data = await res.json();
        if (data.ok) {
          hubState = data;
          renderAll();
        }
      } catch {
        // handled by apiFetch 401 overlay
      }
    }

    let sseSource = null;
    function connectSSE() {
      if (urlParams.get('nosse') === '1') return;
      if (sseSource) {
        try { sseSource.close(); } catch {}
      }
      const tk = getToken();
      const url = '/api/events' + (tk ? '?token=' + encodeURIComponent(tk) : '');
      try {
        sseSource = new EventSource(url);
        sseSource.addEventListener('state', evt => {
          try {
            const data = JSON.parse(evt.data);
            if (data.ok) {
              hubState = data;
              renderAll();
            }
          } catch {}
        });
      } catch {}
    }

    fetchState();
    connectSSE();
    setInterval(fetchState, 3500);
  </script>
