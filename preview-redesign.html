<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DSH 远控 · C端极简交互原型 v3</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --subtle-hover: #e2e8f0;
      --border: #e2e8f0;
      --hairline: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --amber: #f59e0b;
      --amber-soft: #fffbeb;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      background: #cbd5e1;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部预览切换器 */
    .preview-toolbar {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 5px 8px 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    .preview-toolbar button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preview-toolbar button.active {
      background: #ffffff;
      color: #0f172a;
    }
    @media (max-width: 768px) {
      .preview-toolbar { display: none; }
      html, body { background: var(--surface); }
    }

    /* ==================== 整体容器：支持「iPhone 单栏」与「桌面双栏」无缝切换 ==================== */
    .app-shell {
      width: 100%;
      height: 100dvh;
      background: var(--surface);
      display: flex;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    body.PhoneFrameMode .app-shell {
      @media (min-width: 769px) {
        max-width: 402px;
        height: 856px;
        margin: calc((100dvh - 856px) / 2) auto;
        border-radius: 46px;
        border: 11px solid #0f172a;
        box-shadow: 0 30px 80px -15px rgba(15, 23, 42, 0.45);
      }
    }

    .primary-pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      min-width: 0;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    body.DesktopSplitMode .primary-pane {
      @media (min-width: 769px) {
        width: 390px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
      }
    }

    /* 右栏对话页 */
    .chat-fullscreen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 45;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }
    .chat-fullscreen.open {
      transform: translateX(0);
    }

    body.DesktopSplitMode .chat-fullscreen {
      @media (min-width: 769px) {
        position: relative;
        inset: auto;
        flex: 1;
        transform: none !important;
        transition: none;
        z-index: 10;
      }
    }
    body.DesktopSplitMode .back-btn {
      @media (min-width: 769px) {
        display: none;
      }
    }

    /* 提案 5：桌面端右侧大工作区顶部模式切换器（💬 对话流 | 📂 项目代码） */
    .desktop-stage-tabs {
      display: none;
      background: var(--subtle);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }
    body.DesktopSplitMode .desktop-stage-tabs {
      @media (min-width: 769px) {
        display: inline-flex;
      }
    }
    body.DesktopSplitMode .mobile-only-file-btn {
      @media (min-width: 769px) {
        display: none;
      }
    }
    .stage-seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .stage-seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* ==================== 1. 唯一极简顶栏 ==================== */
    .top-bar {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .host-switcher-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border: 1px solid transparent;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      max-width: 235px;
    }
    .host-switcher-btn:hover { background: var(--subtle-hover); }
    .host-switcher-btn:active { transform: scale(0.97); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
      flex-shrink: 0;
    }
    .host-switcher-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .host-switcher-caret {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .new-chat-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: all 0.15s;
    }
    .new-chat-btn:hover { background: var(--primary-hover); }
    .new-chat-btn:active { transform: scale(0.96); }

    /* ==================== 2. 搜索栏 + 智能筛选胶囊条 ==================== */
    .search-and-filter {
      background: var(--surface);
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .search-box-wrap {
      padding: 8px 14px 4px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle);
      border-radius: 11px;
      padding: 7px 11px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .search-box:focus-within {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text);
    }
    .search-clear {
      border: none;
      background: #cbd5e1;
      color: #fff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .filter-strip {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      border: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-pill.active {
      background: var(--text);
      color: #fff;
      font-weight: 600;
    }
    .filter-pill.smart-pill {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .filter-pill.smart-pill.active {
      background: var(--primary);
      color: #fff;
    }
    .filter-pill .count {
      font-size: 11px;
      opacity: 0.75;
    }

    /* ==================== 3. 跨设备实时动态置顶条 ==================== */
    .live-activity-bar {
      margin: 10px 14px 4px;
      padding: 11px 13px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.08);
    }
    .live-activity-left {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .live-activity-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-activity-desc {
      font-size: 12px;
      color: #b45309;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .live-activity-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mini-approve-btn {
      border: none;
      background: #d97706;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-approve-btn.ghost {
      background: rgba(255, 255, 255, 0.75);
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    /* ==================== 4. 微信 / Claude 风格极简通栏列表（含置顶高亮） ==================== */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px 14px 16px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface);
      cursor: pointer;
      transition: background 0.12s;
      width: 100%;
      min-width: 0;
    }
    .session-row.pinned-row {
      background: #fafcff;
    }
    .session-row:hover { background: #f8fafc; }
    .session-row.selected-desktop {
      background: var(--primary-soft);
    }

    .session-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .session-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .session-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .pin-tag {
      font-size: 12px;
      flex-shrink: 0;
    }

    .session-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-right-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 12px;
      color: var(--muted);
    }

    .badge-running {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #059669;
      background: var(--green-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-approval {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #d97706;
      background: var(--amber-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .session-sub-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748b;
      min-width: 0;
    }

    .host-mini-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .project-mini-tag {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--subtle);
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .session-preview-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .row-more-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .row-more-btn:hover {
      background: var(--subtle);
      color: var(--text);
    }

    /* ==================== 5. 底部 3-Tab 导航栏 ==================== */
    .bottom-tabs {
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      flex-shrink: 0;
    }

    .tab-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }
    .tab-btn .icon { font-size: 18px; line-height: 1; }
    .tab-btn.active { color: var(--primary); }

    /* ==================== 6. 聊天视图（含工具点击展开、一键追问气泡、不跳出文件速览抽屉） ==================== */
    .chat-navbar {
      height: 54px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-nav-center {
      flex: 1;
      min-width: 0;
    }
    .chat-nav-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-nav-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-pill-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-pill-btn:hover { background: var(--subtle); }

    /* 聊天内顶部跨任务快捷切换提醒条 */
    .chat-switch-alert {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 6px 12px;
      font-size: 12px;
      color: #92400e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.58;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .thought-box {
      margin-bottom: 9px;
      background: var(--subtle);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .thought-box summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    /* 提案 1：可点击展开输出详情的工具芯片 */
    .tool-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 9px;
    }
    .tool-chip-details {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
    }
    .tool-chip-details summary {
      padding: 5px 10px;
      cursor: pointer;
      color: #334155;
      font-weight: 600;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tool-chip-output {
      padding: 8px 10px;
      background: #0f172a;
      color: #cbd5e1;
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.45;
    }

    /* 提案 1：AI 回复底部智能一键追问胶囊（零打字遥控） */
    .quick-followups {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
      padding-left: 2px;
    }
    .followup-pill {
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .followup-pill:hover {
      background: #dbeafe;
    }
    .followup-pill:active {
      transform: scale(0.96);
    }

    /* 代码块卡片 + 一键复制 */
    .code-card {
      margin-top: 10px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    .code-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 11.5px;
    }
    .code-copy-btn {
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .code-card pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      line-height: 1.5;
    }

    /* 聊天内嵌工具审批卡片 */
    .inline-approval-card {
      align-self: stretch;
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.1);
    }
    .inline-approval-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 6px;
    }
    .inline-approval-cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 10px;
      border-radius: 8px;

      align-items: center;
      gap: 5px;

    .sheet-backdrop {

      background: rgba(15, 23, 42, 0.42);

      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }

    .sheet-panel {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      padding: 12px 16px calc(20px + var(--safe-bottom));
      box-shadow: 0 -10px 35px rgba(15, 23, 42, 0.18);
      max-height: 86%;
      overflow-y: auto;
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: #cbd5e1;
      margin: 0 auto 14px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .host-option.selected {
      border-color: var(--primary);
      background: var(--primary-soft);

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 12px 0 6px;
    }
    .chip-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .choice-chip {
      border: 1px solid var(--border);
      background: var(--subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;

    .choice-chip.selected {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }
    .new-task-textarea {
      width: 100%;
      min-height: 86px;
      border: 1px solid var(--border);
      background: var(--subtle);
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      margin-top: 6px;
    }
    .new-task-textarea:focus {
      background: var(--surface);
      border-color: var(--primary);
    }
    .primary-block-btn {
      width: 100%;
      margin-top: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-item {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      border: none;
      background: var(--subtle);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-item.danger {
      color: var(--red);
      background: var(--red-soft);
    }

    /* 轻量 Toast 提示 */
    .toast-pill {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

      padding: 16px;
      background: var(--bg);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .settings-group-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 0 0 8px 4px;
    }
    .host-visual-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .host-visual-card {

      border-radius: 16px;
      padding: 14px;
      transition: all 0.15s;
    }

    .host-visual-top {

      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .host-metrics-row {

      background: var(--subtle);
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 11.5px;
    }
    .metric-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label { color: var(--muted); }
    .metric-val { font-weight: 700; color: var(--text); }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .settings-item {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--hairline);
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item-title { font-size: 14.5px; font-weight: 600; }
    .settings-item-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .pill-action-btn {
      border: 1px solid var(--border);
      background: var(--subtle);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

      background: var(--primary-soft);
      color: var(--primary);
      border-color: #bfdbfe;
    }

</head>

    function getAllSessionsForView() {
      const raw = currentHostId === 'ALL_HOSTS'
        ? [...MOCK_HOSTS['cc-mac'].sessions, ...MOCK_HOSTS['no2demac-mini'].sessions]
        : [...MOCK_HOSTS[currentHostId].sessions];
      // 置顶会话永远排最前
      return raw.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }

    function findSessionById(id) {
      for (const h of Object.values(MOCK_HOSTS)) {
        const found = h.sessions.find(s => s.id === id);
        if (found) return { session: found, host: h };
      }
      return null;
    }

      const searchBox = document.getElementById('searchAndFilterBox');

    function renderProjectStrip() {
      const sessions = getAllSessionsForView();
      const activeCount = sessions.filter(s => s.status === 'running' || s.status === 'approval').length;
      const unreadCount = sessions.filter(s => s.unread).length;

      const counts = {};
      for (const s of sessions) {
        counts[s.project] = (counts[s.project] || 0) + 1;
      }
      const projects = Object.keys(counts);
      const strip = document.getElementById('projectStrip');

      const smartPills = [];
      if (activeCount > 0) {
        smartPills.push(`<button class="filter-pill smart-pill ${currentProject === 'SMART_ACTIVE' ? 'active' : ''}" onclick="selectProject('SMART_ACTIVE')">🔥 运行/待办 <span class="count">${activeCount}</span></button>`);
      }
      if (unreadCount > 0) {
        smartPills.push(`<button class="filter-pill smart-pill ${currentProject === 'SMART_UNREAD' ? 'active' : ''}" onclick="selectProject('SMART_UNREAD')">🔵 未读 <span class="count">${unreadCount}</span></button>`);
      }

      strip.innerHTML = [
        `<button class="filter-pill ${currentProject === 'ALL' ? 'active' : ''}" onclick="selectProject('ALL')">全部 <span class="count">${sessions.length}</span></button>`,
        ...smartPills,
        ...projects.map(p => `<button class="filter-pill ${currentProject === p ? 'active' : ''}" onclick="selectProject('${p}')">${p} <span class="count">${counts[p]}</span></button>`)
      ].join('');
    }

    function renderSessionList() {
      const viewport = document.getElementById('mainViewport');
      const allSessions = getAllSessionsForView();

      let pendingApprovalSession = null;
      for (const h of Object.values(MOCK_HOSTS)) {
        const found = h.sessions.find(s => s.status === 'approval');
        if (found) { pendingApprovalSession = { session: found, host: h }; break; }
      }

      const q = searchQuery.trim().toLowerCase();
      const filtered = allSessions.filter(s => {
        if (currentProject === 'SMART_ACTIVE' && s.status !== 'running' && s.status !== 'approval') return false;
        if (currentProject === 'SMART_UNREAD' && !s.unread) return false;
        if (!['ALL', 'SMART_ACTIVE', 'SMART_UNREAD'].includes(currentProject) && s.project !== currentProject) return false;
        if (!q) return true;
        return s.title.toLowerCase().includes(q) || s.project.toLowerCase().includes(q) || s.lastPreview.toLowerCase().includes(q);
      });

      const liveBannerHtml = pendingApprovalSession ? `
        <div class="live-activity-bar">
          <div class="live-activity-left" onclick="openChat('${pendingApprovalSession.session.id}')">
            <div class="live-activity-title">⏳ [${pendingApprovalSession.host.name}] 等待你批准工具执行</div>

          </div>
        </div>
      ` : '';

      const rowsHtml = filtered.map(s => {
        const hostObj = MOCK_HOSTS[s.hostId];
        let statusHtml = `<span class="session-time">${s.time}</span>`;
        if (s.status === 'running') {
          statusHtml = `<span class="badge-running">● 运行中</span>`;
        } else if (s.status === 'approval') {
          statusHtml = `<span class="badge-approval">⏳ 待确认</span>`;

        const unreadHtml = s.unread ? `<span class="unread-dot" title="有新回复"></span>` : '';
        const pinHtml = s.pinned ? `<span class="pin-tag" title="已置顶">📌</span>` : '';
        const hostBadgeHtml = currentHostId === 'ALL_HOSTS'
          ? `<span class="host-mini-tag">${hostObj.name}</span>`
          : '';
        const rolePrefix = s.lastRole === 'user' ? '🧑 我: ' : '🤖 ';

        return `
          <div class="session-row ${s.pinned ? 'pinned-row' : ''} ${s.id === activeSessionId ? 'selected-desktop' : ''}" onclick="openChat('${s.id}')">
            <div class="session-main">
              <div class="session-top-line">
                <div class="session-title-wrap">
                  ${unreadHtml}
                  ${pinHtml}
                  <div class="session-title">${s.title}</div>
                </div>
                <div class="session-right-meta">${statusHtml}</div>
              </div>
              <div class="session-sub-line">
                ${hostBadgeHtml}
                <span class="project-mini-tag">📁 ${s.project}</span>
                <span class="session-preview-text">${rolePrefix}${s.lastPreview}</span>
              </div>
            </div>
            <button class="row-more-btn" title="更多操作" onclick="event.stopPropagation(); openSessionActions('${s.id}')">⋯</button>
          </div>
        `;
      }).join('');

      viewport.innerHTML = `
        ${liveBannerHtml}
        <div class="session-list">
          ${rowsHtml || `<div style="padding:48px 20px;text-align:center;color:#94a3b8;font-size:14px;">没有匹配的对话记录</div>`}
        </div>
      `;

    function openChat(sessionId) {
      const found = findSessionById(sessionId);
      if (!found) return;
      const { session: s, host } = found;
      activeSessionId = s.id;
      s.unread = false;

      document.getElementById('chatTitle').textContent = s.title;
      document.getElementById('chatSub').textContent = `📁 ${s.project} · 💻 ${host.name} (${s.msgCount} 条对话)`;

      // 检查是否有其他会话处于待确认状态，提供顶部一键切换条
      let otherApproval = null;
      for (const h of Object.values(MOCK_HOSTS)) {
        const f = h.sessions.find(x => x.status === 'approval' && x.id !== s.id);
        if (f) { otherApproval = { session: f, host: h }; break; }
      }
      const alertBar = document.getElementById('chatSwitchAlert');
      if (otherApproval) {
        alertBar.style.display = 'flex';
        alertBar.innerHTML = `
          <span>⏳ [${otherApproval.host.name}]「${otherApproval.session.title}」正在等你确认命令</span>
          <button style="border:none;background:#d97706;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;" onclick="openChat('${otherApproval.session.id}')">立即切换 ›</button>
        `;
      } else {
        alertBar.style.display = 'none';
      }

      const runningBar = document.getElementById('runningControlBar');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('chatSendBtn');

      if (s.status === 'running') {
        runningBar.classList.add('show');
        chatInput.placeholder = '⚡ 实时插话 (Steer)：补充指令将立即注入...';
        sendBtn.textContent = '⚡ 插话';
      } else {
        runningBar.classList.remove('show');
        chatInput.placeholder = '发指令继续对话...';
        sendBtn.textContent = '发送';
      }

      if (!s.messages || s.messages.length === 0) {
        s.messages = [
          { role: 'user', text: s.title },
          { role: 'assistant', text: s.lastPreview }
        ];
      }

      renderChatMessages(s);
      if (desktopStageMode === 'code') {
        fileProject = s.project;
        renderFilesTab(document.getElementById('desktopStageCodePane'));
      }
      renderProjectStrip();
      renderSessionList();
      document.getElementById('chatFullscreen').classList.add('open');

      if (!found) return;
      const { session: s } = found;
      s.status = 'idle';
      s.time = '刚刚';
      if (!s.messages || s.messages.length === 0) s.messages = [];
      if (allow) {
        s.lastPreview = '已批准执行，Cloud Run 部署已完成！';
        s.messages.push({
          role: 'assistant',
          tools: [{ name: 'bash: ./deploy-cloudrun.sh (已批准)', output: 'Deploying container to Cloud Run service [dsh-remotecontrol-hub]...\n✓ Done. Service URL: https://dsh-remotecontrol-hub-339795034470.us-central1.run.app' }],
          text: '✅ 已收到你的批准，命令执行完毕，线上服务已更新到最新版本！'
        });
        showToast('✅ 已允许执行并完成任务');
      } else {
        s.lastPreview = '已拒绝该工具执行，等待你进一步指示。';
        s.messages.push({
          role: 'assistant',
          text: '已取消执行该命令。请告诉我接下来需要怎么调整？'
        });
        showToast('已拒绝执行该工具');
      }
      renderAll();
      if (activeSessionId) openChat(activeSessionId);
    }

    function stopActiveSession() {
      const found = findSessionById(activeSessionId);
      if (!found) return;
      found.session.status = 'idle';
      found.session.lastPreview = '已根据你的指令停止当前运行。';
      found.session.messages.push({
        role: 'assistant',
        text: '⏹ 已立即停止当前任务执行。你可以随时发送新指令继续。'
      });
      showToast('⏹ 已停止当前任务');
      openChat(activeSessionId);
    }

    function sendMockMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !activeSessionId) return;
      const found = findSessionById(activeSessionId);
      if (!found) return;
      const { session: s, host } = found;
      const wasRunning = s.status === 'running';

      s.messages.push({ role: 'user', text });
      s.messages.push({
        role: 'assistant',
        thinking: wasRunning ? '收到实时插话 (Steer)，正在动态调整当前执行计划...' : '正在远程电脑工作区执行你的指令...',
        tools: [{ name: `bash (${host.name}): executing in ${s.project}`, output: `cwd: /Users/${host.name}/${s.project}\nCommand completed successfully in 180ms.` }],
        text: wasRunning
          ? `⚡ [实时插话已生效] 已在当前运行流中优先采纳你的要求：「${text}」。`
          : `已在【${host.name} · ${s.project}】执行完毕：「${text}」。`
      });
      s.lastPreview = s.messages[s.messages.length - 1].text;
      s.time = '刚刚';
      s.msgCount += 2;
      input.value = '';
      renderChatMessages(s);
      renderSessionList();
    }

    function closeChat() {
      document.getElementById('chatFullscreen').classList.remove('open');
    }

    // ==================== 提案 2：聊天内「📂 文件速览浮层抽屉」（不跳出当前对话） ====================
    function openInChatFileDrawer() {
      const found = findSessionById(activeSessionId);
      if (!found) return;
      inChatSubDir = null;
      renderInChatFileDrawer();
      document.getElementById('inChatFileSheet').classList.add('open');
    }

    function renderInChatFileDrawer(previewItem = null) {
      const found = findSessionById(activeSessionId);
      if (!found) return;
      const { session: s, host } = found;
      const projData = host.filesByProject[s.project] || { cwd: `/Users/${host.name}/${s.project}`, items: [] };
      document.getElementById('inChatFileTitle').textContent = `📂 ${s.project} (${host.name})`;
      const body = document.getElementById('inChatFileBody');

      if (previewItem) {
        const lines = (previewItem.content || '').split('\n');
        const numberedHtml = lines.map((line, i) =>
          `<div style="display:flex;gap:14px;"><span style="color:#64748b;user-select:none;width:24px;text-align:right;flex-shrink:0;">${i + 1}</span><span style="white-space:pre;">${line.replace(/</g, '&lt;')}</span></div>`
        ).join('');
        body.innerHTML = `
          <div class="breadcrumbs-bar" style="justify-content:space-between;">
            <button class="back-btn" style="padding:0;font-size:13px;" onclick="renderInChatFileDrawer()">‹ 返回目录</button>
            <span style="font-weight:700;color:var(--text);">${previewItem.name}</span>
            <button class="icon-pill-btn" style="color:var(--primary);border-color:#bfdbfe;background:var(--primary-soft);" onclick="quoteFileIntoChat('${previewItem.name}')">📎 插入到输入框</button>
          </div>
          <div style="padding:14px 12px;background:#0f172a;color:#f8fafc;min-height:320px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;">
            ${numberedHtml}
          </div>
        `;
        return;
      }

      const items = inChatSubDir ? inChatSubDir.children : projData.items;
      body.innerHTML = `
        <div class="breadcrumbs-bar">
          <span class="crumb-link" onclick="inChatSubDir=null;renderInChatFileDrawer()">🏠 ${s.project}</span>
          ${inChatSubDir ? `<span>/</span><span style="font-weight:600;color:var(--text);">${inChatSubDir.name}</span>` : `<span style="color:#94a3b8;margin-left:auto;font-family:monospace;">${projData.cwd}</span>`}
        </div>
        <div>
          ${(items || []).map((f, idx) => `
            <div class="file-row" onclick="clickInChatFileItem(${idx})">
              <div class="file-row-left">
                <span style="font-size:18px;">${f.isDir ? '📁' : '📄'}</span>
                <span style="font-weight:500;">${f.name}</span>
              </div>
              <span style="font-size:12px;color:#94a3b8;">${f.size} · ${f.updated} ›</span>
            </div>
          `).join('') || '<div style="padding:32px;text-align:center;color:#94a3b8;">此项目暂无缓存文件列表</div>'}
        </div>
      `;
    }

    function clickInChatFileItem(idx) {
      const found = findSessionById(activeSessionId);
      if (!found) return;
      const projData = found.host.filesByProject[found.session.project] || { items: [] };
      const list = inChatSubDir ? inChatSubDir.children : projData.items;
      const item = list[idx];
      if (!item) return;
      if (item.isDir) {
        inChatSubDir = item;
        renderInChatFileDrawer();
      } else {
        renderInChatFileDrawer(item);
      }
    }

    function quoteFileIntoChat(fileName) {
      closeSheet('inChatFileSheet');
      const input = document.getElementById('chatInput');
      input.value = `请查看 @${fileName} 并帮我分析：${input.value}`;
      input.focus();
      showToast(`📎 已将 @${fileName} 插入到输入框`);
    }

    // ==================== 提案 5：桌面端右侧工作区「💬 对话流 | 📂 项目代码」切换 ====================
    function switchDesktopStage(mode) {
      desktopStageMode = mode;
      document.getElementById('stageBtnChat').classList.toggle('active', mode === 'chat');
      document.getElementById('stageBtnCode').classList.toggle('active', mode === 'code');

      const chatBox = document.getElementById('chatMessages');
      const composer = document.getElementById('chatComposerBar');
      const codePane = document.getElementById('desktopStageCodePane');

      if (mode === 'code') {
        chatBox.style.display = 'none';
        composer.style.display = 'none';
        codePane.style.display = 'block';
        const found = findSessionById(activeSessionId);
        if (found) fileProject = found.session.project;
        renderFilesTab(codePane);
      } else {
        chatBox.style.display = 'flex';
        composer.style.display = 'flex';
        codePane.style.display = 'none';
      }

    function submitNewTask() {
      const text = document.getElementById('newTaskInput').value.trim();
      if (!text) {
        showToast('请输入任务指令');
        return;
      }
      const host = MOCK_HOSTS[newTaskHostId];
      const newId = 'new-' + Date.now();
      const newSession = {
        id: newId,
        hostId: host.id,
        title: text.slice(0, 22),
        project: newTaskProject,
        pinned: false,
        msgCount: 2,
        time: '刚刚',
        unread: false,
        status: 'running',
        lastRole: 'assistant',
        lastPreview: '正在为您分析工作区并执行指令...',
        messages: [
          { role: 'user', text },
          {
            role: 'assistant',
            thinking: `已进入 ${host.name} 的 ${newTaskProject} 工作区，正在初始化工具链...`,
            tools: [{ name: `cwd: ${newTaskProject}`, output: `Working directory set to /Users/${host.name}/${newTaskProject}` }],
            text: `🚀 已在【${host.name} · ${newTaskProject}】启动新任务，正在执行中...`
          }
        ]
      };
      host.sessions.unshift(newSession);
      document.getElementById('newTaskInput').value = '';
      closeSheet('newTaskSheet');
      showToast(`🚀 已在 ${host.name} 启动新任务`);
      renderAll();
      openChat(newId);

        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.title}</span>

    function togglePinTargetSession() {
      if (!actionTargetSession) return;
      actionTargetSession.pinned = !actionTargetSession.pinned;
      closeSheet('actionSheet');
      showToast(actionTargetSession.pinned ? '📌 已置顶该对话' : '已取消置顶');
      renderAll();
    }

    function saveInlineRename() {
      const val = document.getElementById('renameInlineInput').value.trim();
      if (!val || !actionTargetSession) return;
      actionTargetSession.title = val;
      closeSheet('actionSheet');
      showToast('✏️ 已更新会话标题');
      renderAll();
      if (activeSessionId === actionTargetSession.id) {
        document.getElementById('chatTitle').textContent = val;
      }
    }

    function shareTargetSession() {
      closeSheet('actionSheet');
      navigator.clipboard?.writeText('https://dsh-remotecontrol-hub-339795034470.us-central1.run.app/share/shr-demo#k=AES256Key');
      showToast('🔗 加密分享链接已复制到剪贴板！');
    }

    function deleteTargetSession() {
      if (!confirmDeleteOnce) {
        confirmDeleteOnce = true;
        renderActionSheet();
        return;
      }
      const host = MOCK_HOSTS[actionTargetSession.hostId];
      host.sessions = host.sessions.filter(x => x.id !== actionTargetSession.id);
      closeSheet('actionSheet');
      showToast('🗑️ 已删除会话');
      renderAll();
    }

    function renderMigrateWizard(runningStep = 0) {
      const body = document.getElementById('migrateWizardBody');
      if (runningStep > 0) {
        const steps = [
          '1. 正在打包源电脑 (' + MOCK_HOSTS[migSource].name + ') 的 ~/.dsh 会话快照...',
          '2. 正在通过加密通道上传快照至总控台...',
          '3. 目标电脑 (' + MOCK_HOSTS[migTarget].name + ') 已完成恢复并切换飞书主控！'
        ];
        body.innerHTML = `
          <div style="padding:16px 4px;">
            ${steps.map((text, idx) => `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;color:${idx + 1 <= runningStep ? '#059669' : '#94a3b8'};font-weight:${idx + 1 === runningStep ? '700' : '500'};">
                <span>${idx + 1 < runningStep ? '✅' : idx + 1 === runningStep ? '⏳' : '⚪'}</span>
                <span>${text}</span>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      body.innerHTML = `
        <div class="form-label">1. 选择迁移方向</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <div style="flex:1;padding:10px 12px;border-radius:12px;background:var(--subtle);text-align:center;font-weight:700;font-size:14px;">
            💻 ${MOCK_HOSTS[migSource].name}
            <div style="font-size:11px;color:#64748b;font-weight:400;margin-top:2px;">源电脑 (${MOCK_HOSTS[migSource].sessions.length} 条会话)</div>
          </div>
          <button class="pill-action-btn" onclick="swapMigrateHosts()" title="交换源和目标">⇄ 互换</button>
          <div style="flex:1;padding:10px 12px;border-radius:12px;background:var(--primary-soft);border:1px solid #bfdbfe;text-align:center;font-weight:700;font-size:14px;color:var(--primary);">
            💻 ${MOCK_HOSTS[migTarget].name}
            <div style="font-size:11px;color:#3b82f6;font-weight:400;margin-top:2px;">目标电脑</div>
          </div>
        </div>

        <div class="form-label">2. 迁移选项</div>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14px;cursor:pointer;">
          <input type="checkbox" ${migSwitchFeishu ? 'checked' : ''} onchange="migSwitchFeishu=this.checked" />
          <span>迁移完成后自动把飞书机器人切到目标电脑</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14px;cursor:pointer;">
          <input type="checkbox" ${migWipeSource ? 'checked' : ''} onchange="migWipeSource=this.checked" />
          <span>迁移后清空源电脑上的会话历史（保留飞书连接凭证）</span>
        </label>

        <button class="primary-block-btn" onclick="runMockMigration()">🚀 开始一键加密迁移</button>
      `;
    }

    function swapMigrateHosts() {
      const tmp = migSource;
      migSource = migTarget;
      migTarget = tmp;
      renderMigrateWizard(0);
    }

    function runMockMigration() {
      renderMigrateWizard(1);
      setTimeout(() => renderMigrateWizard(2), 700);
      setTimeout(() => renderMigrateWizard(3), 1400);
      setTimeout(() => {
        if (migSwitchFeishu) toggleFeishuBind(migTarget);
        closeSheet('migrateSheet');
        showToast(`🎉 已完成 ${MOCK_HOSTS[migSource].name} ➔ ${MOCK_HOSTS[migTarget].name} 迁移！`);
        renderAll();
      }, 2200);
    }

    function selectProject(proj) {
      currentProject = proj;
      renderAll();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      renderAll();
    }

    function openHostSheet() {
      const totalCount = MOCK_HOSTS['no2demac-mini'].sessions.length + MOCK_HOSTS['cc-mac'].sessions.length;
      const list = document.getElementById('hostOptionList');
      list.innerHTML = [
        `<div class="host-option ${currentHostId === 'ALL_HOSTS' ? 'selected' : ''}" onclick="selectHost('ALL_HOSTS')">
          <div>
            <div style="font-weight:700;font-size:15px;">🌐 全部电脑汇总</div>
            <div style="font-size:12.5px;color:#64748b;margin-top:2px;">一屏混排查看 2 台电脑共 ${totalCount} 条会话</div>
          </div>
          <span style="font-size:13px;font-weight:600;color:#2563eb;">${currentHostId === 'ALL_HOSTS' ? '当前视图 ✓' : '切换 ›'}</span>
        </div>`,
        ...Object.values(MOCK_HOSTS).map(h => `
          <div class="host-option ${h.id === currentHostId ? 'selected' : ''}" onclick="selectHost('${h.id}')">
            <div>
              <div style="font-weight:700;font-size:15px;">🟢 ${h.name}</div>
              <div style="font-size:12.5px;color:#64748b;margin-top:2px;">${h.sessions.length} 条会话 · ${h.feishuActive ? '🎯 飞书当前主控' : '在线待命'}</div>
            </div>
            <span style="font-size:13px;font-weight:600;color:#2563eb;">${h.id === currentHostId ? '当前设备 ✓' : '切换 ›'}</span>
          </div>
        `)
      ].join('');
      document.getElementById('hostSheet').classList.add('open');
    }

    function closeSheet(id) {
      document.getElementById(id).classList.remove('open');
    }

    function selectHost(id) {
      currentHostId = id;
      currentProject = 'ALL';
      closeSheet('hostSheet');
      renderAll();
      showToast(id === 'ALL_HOSTS' ? '🌐 已切换到全部电脑汇总视图' : `💻 已切换到 ${MOCK_HOSTS[id].name}`);
    }

    function toggleFeishuBind(hostId) {
      for (const h of Object.values(MOCK_HOSTS)) h.feishuActive = false;
      MOCK_HOSTS[hostId].feishuActive = true;
      renderAll();
      showToast(`🎯 飞书机器人主控已切到 ${MOCK_HOSTS[hostId].name}`);
    }

    function toggleFeishuNotify(hostId) {
      const h = MOCK_HOSTS[hostId];
      h.feishuNotify = !h.feishuNotify;
      renderAll();
      showToast(h.feishuNotify ? '🔔 已开启飞书完成通知' : '🔕 已关闭飞书通知');
    }

    function setPreviewMode(mode) {
      const isPhone = mode === 'phone';
      document.body.classList.toggle('PhoneFrameMode', isPhone);
      document.body.classList.toggle('DesktopSplitMode', !isPhone);
      document.getElementById('btnPhoneMode').classList.toggle('active', isPhone);
      document.getElementById('btnDesktopMode').classList.toggle('active', !isPhone);
      if (isPhone && desktopStageMode === 'code') {
        switchDesktopStage('chat');
      }
      if (!isPhone && activeSessionId) {
        openChat(activeSessionId);
      }
    }

    // 初始化渲染
    renderAll();
    openChat('s1');
    closeChat();
  </script>
</body>
</html>
