name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-to-npm
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build & Publish npm Package (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          npm install
          npm --prefix dsh-feishu install

      - name: Run tests & build frontend
        run: |
          node --test --test-concurrency=4 dsh-feishu/test/*.test.js
          npm run build

      - name: Publish to npm via OIDC Trusted Publisher
        run: |
          set -eo pipefail
          PKG_NAME="$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('./package.json', 'utf8')).name)")"
          PKG_VER="$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('./package.json', 'utf8')).version)")"
          if npm view "${PKG_NAME}@${PKG_VER}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Package ${PKG_NAME}@${PKG_VER} is already published on npm. Skipping."
            exit 0
          fi
          PUB_LOG="$(mktemp)"
          if npm publish --provenance --access public --registry https://registry.npmjs.org/ 2>&1 | tee "${PUB_LOG}"; then
            rm -f "${PUB_LOG}"
            exit 0
          fi
          if grep -Eqi "cannot publish over the previously published versions|cannot publish over previously staged version|You cannot publish over|EPUBLISHCONFLICT" "${PUB_LOG}"; then
            echo "Package ${PKG_NAME}@${PKG_VER} was already published or staged by a preceding run. Skipping."
            rm -f "${PUB_LOG}"
            exit 0
          fi
          rm -f "${PUB_LOG}"
          exit 1
